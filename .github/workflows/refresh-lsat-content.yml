# Auto-refresh the static site's content artifact — BL-20260702-11.
#
# `lsat-static/content.json` is the HITL-approved export of the LSAT bank, and
# it was refreshed only by a human remembering to run `make lsat-export`.
# tests/test_lsat_site.py fails CI when it goes stale, so forgetting turned
# into a red build on an unrelated PR rather than a fresh site. This workflow
# does the export whenever the source data lands on main.
#
# Why here and not in `promote_to_bank`: a backend process should not be
# running git commits, and the bank write happens inside a bind-mounted
# container directory whose host-side git state it has no business touching.
# The export is a pure function of the data files, so CI is the right home.
#
# The root drift gate stays as the safety net — this workflow is the
# convenience, not the guarantee.

name: refresh-lsat-content

on:
  push:
    branches: [main]
    paths:
      - "backend/law_ai/lsat/services/data/**"
      - ".github/workflows/refresh-lsat-content.yml"
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch deploy-lsat-pages.yml: a push made with GITHUB_TOKEN
  # does not trigger other workflows, so the Pages build must be asked for
  # explicitly or the commit would land and the site would stay stale.
  actions: write

# Never race the Pages deploy, and never run two refreshes at once.
concurrency:
  group: refresh-lsat-content
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-export lsat-static/content.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        # BL-20260815-02: superset of backend/Dockerfile's extras.
        run: pip install -e ".[dev,local-ai]"

      - name: Export the bank
        working-directory: backend
        env:
          # File loaders only — the exporter reads services/data/*.json and
          # never touches Postgres or Neo4j (verified: `lsat_export` imports
          # only bank/guides/library/writing loaders).
          DJANGO_SETTINGS_MODULE: law_ai.settings.test
          DATABASE_URL: sqlite:///./_export.sqlite3
          PHOENIX_COLLECTOR_ENDPOINT: ""
        run: python manage.py lsat_export --out var/lsat_site

      - name: Update content.json only if the content actually changed
        id: refresh
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, shutil

          fresh = pathlib.Path("backend/var/lsat_site/content.json")
          live = pathlib.Path("lsat-static/content.json")

          # Every export stamps a new `generated_at`, so a byte comparison
          # would commit on every run forever. Compare everything else.
          def payload(path):
              data = json.loads(path.read_text(encoding="utf-8"))
              data.pop("generated_at", None)
              return data

          if live.is_file() and payload(fresh) == payload(live):
              print("changed=false")
          else:
              shutil.copyfile(fresh, live)
              print("changed=true")
          PY

      - name: Commit the refreshed artifact
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lsat-static/content.json
          git commit -m "chore(lsat): refresh static site content.json from the bank

          Automated by .github/workflows/refresh-lsat-content.yml after a change
          under backend/law_ai/lsat/services/data/ (BL-20260702-11)."
          git push

      - name: Trigger the Pages build
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A GITHUB_TOKEN push raises no `push` event, so deploy-lsat-pages.yml
        # would never see the commit that just landed.
        run: gh workflow run deploy-lsat-pages.yml --ref main

      - name: Report a no-op
        if: steps.refresh.outputs.changed != 'true'
        run: |
          echo "::notice::content.json already matches the bank " \
               "(only generated_at would have changed) — nothing committed."
