services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Spec 053: the ocrmd scanner library, opt-in (see .env.example).
        INSTALL_OCRMD: ${INSTALL_OCRMD:-0}
    ports:
      - "8000:8000"
    # Root .env (see .env.example) is layered under the explicit environment
    # block: `environment` wins over `env_file`, so the dev-stack wiring below
    # stays canonical while operator secrets (AGENT_API_KEY, COURTLISTENER_*,
    # AUTONOMY_*) actually reach the container instead of being silently
    # ignored. `required: false` keeps a fresh clone bootable without a .env.
    env_file:
      - path: ./.env
        required: false
    environment:
      - DATABASE_URL=postgresql://law_ai:law_ai-dev@postgres:5432/law_ai
      # Spec 035: the LangGraph checkpointer reads POSTGRES_URL (not
      # DATABASE_URL); without this override the host-oriented .env value
      # (localhost) leaks in and checkpoint setup silently degrades.
      - POSTGRES_URL=postgresql+asyncpg://law_ai:law_ai-dev@postgres:5432/law_ai
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=law_ai-dev
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_UI_URL=http://localhost:6006
      - PHOENIX_PROJECT_NAME=law_ai
      # BL-20260502-07: phoenix | langfuse | none. Everything above is the
      # phoenix backend's own input; LANGFUSE_* takes over when switched.
      - OBSERVABILITY_BACKEND=${OBSERVABILITY_BACKEND:-phoenix}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - LANGGRAPH_CHECKPOINTER=postgres
      # Autonomy loop (spec 018) — default off; set AUTONOMY_ENABLED=True in .env to activate.
      - AUTONOMY_ENABLED=${AUTONOMY_ENABLED:-False}
      - AUTONOMY_ALLOWED_SOURCES=${AUTONOMY_ALLOWED_SOURCES:-}
      # Inside the container, /app == ./backend on host, so var/autonomy is correct.
      - AUTONOMY_DIGEST_DIR=${AUTONOMY_DIGEST_DIR:-var/autonomy}
      - AUTONOMY_MAX_INGEST_PER_CYCLE=${AUTONOMY_MAX_INGEST_PER_CYCLE:-25}
      # Repo root for BACKLOG.md + specs/ (mounted at /repo below).
      - REPO_ROOT=/repo
    depends_on:
      # Healthcheck-gated: migrate/ensure_checkpointer race cold DBs otherwise.
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      # started (not healthy): Ollama pulls models in the background and the
      # API degrades gracefully without it — don't block the whole stack.
      ollama:
        condition: service_started
      phoenix:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./:/repo
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py ensure_checkpointer && daphne -b 0.0.0.0 -p 8000 law_ai.asgi:application"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      # collectstatic + migrate + checkpointer bootstrap runs before daphne.
      start_period: 90s
    restart: on-failure:2

  worker:
    # Spec 011 FR-11: Celery worker for ingestion quarantine + audit fallback.
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_OCRMD: ${INSTALL_OCRMD:-0}
    env_file:
      - path: ./.env
        required: false
    environment:
      - DATABASE_URL=postgresql://law_ai:law_ai-dev@postgres:5432/law_ai
      # Spec 035: the LangGraph checkpointer reads POSTGRES_URL (not
      # DATABASE_URL); without this override the host-oriented .env value
      # (localhost) leaks in and checkpoint setup silently degrades.
      - POSTGRES_URL=postgresql+asyncpg://law_ai:law_ai-dev@postgres:5432/law_ai
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=law_ai-dev
      # Beat-scheduled autonomy cycles (test synthesis, LSAT authoring) call
      # Ollama from THIS container — without this it defaults to localhost.
      - OLLAMA_BASE_URL=http://ollama:11434
      - DJANGO_SETTINGS_MODULE=law_ai.settings.dev
      # Autonomy loop (spec 018) — default off; set AUTONOMY_ENABLED=True in .env to activate.
      - AUTONOMY_ENABLED=${AUTONOMY_ENABLED:-False}
      - AUTONOMY_ALLOWED_SOURCES=${AUTONOMY_ALLOWED_SOURCES:-}
      # Inside the container, /app == ./backend on host, so var/autonomy is correct.
      - AUTONOMY_DIGEST_DIR=${AUTONOMY_DIGEST_DIR:-var/autonomy}
      - AUTONOMY_MAX_INGEST_PER_CYCLE=${AUTONOMY_MAX_INGEST_PER_CYCLE:-25}
      # Repo root for BACKLOG.md + specs/ (mounted at /repo below).
      - REPO_ROOT=/repo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./:/repo
    # --beat embeds the beat scheduler so crontab entries fire in local dev.
    # In production, run a dedicated beat container instead.
    command: celery -A law_ai worker --beat -l info -Q autonomy,celery
    healthcheck:
      # Celery workers have no HTTP port — use inspect ping instead.
      test: [ "CMD-SHELL", "celery -A law_ai inspect ping --destination celery@$$HOSTNAME || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: on-failure:2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Browser → same-origin proxy → backend, so the API key never reaches
      # the bundle (BL-20260430-07). AGENT_API_KEY is read by the Next server
      # only; it is blank by default, matching the open localhost posture.
      - NEXT_PUBLIC_API_BASE_URL=/api/backend
      # `make test-e2e` overrides this to the backend-e2e sidecar (spec 051):
      # now that REST goes through the proxy, the browser's API calls follow
      # whatever the Next server points at, and the whole no-model-bill
      # guarantee of the e2e stack depends on that being the pinned-degraded
      # sidecar rather than the dev backend.
      - BACKEND_INTERNAL_URL=${FRONTEND_BACKEND_URL:-http://backend:8000}
      - NEXT_PUBLIC_WS_URL=${FRONTEND_WS_URL:-ws://localhost:8000}
      - AGENT_API_KEY=${AGENT_API_KEY:-}
    depends_on:
      # started, not healthy: Next dev doesn't need the API to boot, and
      # blocking the UI on backend migrations makes the dev loop miserable.
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    healthcheck:
      # node:alpine ships busybox wget; Next dev serves / once compiled.
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    # MAJOR VERSION IS PINNED ON PURPOSE (BL-20260503-25). The on-disk cluster
    # in the `pgdata` volume was initialized by Postgres 16, and a Postgres
    # server refuses to start against a data directory written by a different
    # major version ("database files are incompatible with server"). Bumping
    # this tag to 17/18 without doing something about the volume gives you a
    # postgres container that crash-loops on boot, not an upgrade.
    #
    # To bump: `make reset-db` (wipes pgdata, dev data only), change the tag,
    # `make dev && make migrate`. To keep the data, pg_upgrade or a
    # dump/restore instead — see "Bumping the Postgres major version" in
    # docs/local-ai.md.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: law_ai
      POSTGRES_PASSWORD: law_ai-dev
      POSTGRES_DB: law_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U law_ai" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/law_ai-dev
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      # Bounded memory so Neo4j + Ollama can coexist on the 32 GB laptops
      # the constitution targets (defaults grow with host RAM otherwise).
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      # 30s + 5x10s was enough on a warm laptop but not on a cold CI runner
      # sharing its memory with the rest of the e2e stack: the a11y job failed
      # with "container law-ai-neo4j-1 is unhealthy" while Neo4j was still
      # coming up. Waiting longer only ever costs time on a slow boot; it
      # cannot mask a real failure, because an unhealthy container still fails.
      retries: 10
      start_period: 60s
    restart: unless-stopped
    mem_limit: 4g

  ollama:
    # Pinned (was :latest): reproducible dev + eval runs. Bump deliberately —
    # a silent Ollama upgrade can shift LegalBench numbers under you.
    image: ollama/ollama:0.12.6
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
      - ./backend/scripts/ollama-bootstrap.sh:/scripts/ollama-bootstrap.sh:ro
      - ./backend/scripts/ollama-healthcheck.sh:/scripts/ollama-healthcheck.sh:ro
    environment:
      # Unload idle models so 7B + 8B don't sit resident together on
      # 32 GB Apple Silicon laptops.
      - OLLAMA_KEEP_ALIVE=5m
      # Single source of truth for the model set: the bootstrap script reads
      # this, and `make local-ai-pull` reads it back out of the container so
      # the list cannot drift between the two (BL-20260810-12).
      - OLLAMA_BOOTSTRAP_MODELS=${OLLAMA_BOOTSTRAP_MODELS:-mistral:7b-instruct-q4_K_M llama3.1:8b-instruct-q4_K_M nomic-embed-text}
      # Air-gapped hosts (BL-20260502-06): 1 makes ollama-bootstrap.sh skip
      # every `ollama pull`, because scripts/offline-install.sh already put
      # the models in the volume and the registry is unreachable here.
      - OLLAMA_OFFLINE=${OLLAMA_OFFLINE:-0}
    # Spec 010 FR-7: idempotent bootstrap pulls the default model set in
    # the background; the smallest model gates readiness so the rest of
    # the stack starts quickly.
    entrypoint: [ "/bin/sh" ]
    command: [ "/scripts/ollama-bootstrap.sh" ]
    healthcheck:
      # Gate on the GATE MODEL being present, not merely on the server
      # answering (BL-20260810-12). A model-less-but-listening Ollama used
      # to pass this check, so `up --wait` could hand a green stack to the
      # nightly eval and every item would fail against a missing model.
      test: [ "CMD-SHELL", "/scripts/ollama-healthcheck.sh" ]
      interval: 15s
      timeout: 10s
      retries: 20
      # Generous: the gate model is a ~4 GB pull on a cold volume.
      start_period: 600s
    restart: unless-stopped
    mem_limit: 12g

  phoenix:
    # Spec 010 FR-6: self-hosted Arize Phoenix as the OTEL collector + UI.
    # Pinned (was :latest) for reproducible traces UI + OTLP behavior.
    image: arizephoenix/phoenix:12.9.0
    ports:
      - "6006:6006" # UI + OTLP/HTTP
      - "4317:4317" # OTLP/gRPC (unused today, exposed for future)
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix:/data
    healthcheck:
      # Distroless image: NO /bin/sh, so CMD-SHELL can never run — exec-form
      # with the bare python binary (present at /usr/bin/python) is required.
      # An uncaught urlopen exception is a nonzero exit, so no `|| exit 1`.
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006', timeout=3)" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Browser end-to-end harness (spec 051 / BL-20260811-16). Both services sit
  # behind the `e2e` profile so `make dev`, `make test`, and `make down` never
  # see them; `make test-e2e` is the only entry point.
  # ---------------------------------------------------------------------------
  backend-e2e:
    # The API the e2e browser talks to. Same image, code, and databases as
    # `backend`, but pinned to the Ollama tier with an unreachable Ollama and
    # no retries, so `/api/analysis` takes the honest degraded path every
    # time: deterministic `ready → agent_step → complete` events, no
    # third-party LLM call, no bill — whatever credentials the operator's
    # .env carries. `AGENT_API_KEY` is forced from E2E_AGENT_API_KEY (empty
    # by default) so the auth spec, not the operator's .env, decides whether
    # the API is gated.
    profiles: [ "e2e" ]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: false
    environment:
      - DATABASE_URL=postgresql://law_ai:law_ai-dev@postgres:5432/law_ai
      - POSTGRES_URL=postgresql+asyncpg://law_ai:law_ai-dev@postgres:5432/law_ai
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=law_ai-dev
      - REDIS_URL=redis://redis:6379
      - LANGGRAPH_CHECKPOINTER=postgres
      - PHOENIX_COLLECTOR_ENDPOINT=
      - LLM_PROVIDER_CHAIN=ollama
      - OLLAMA_BASE_URL=http://127.0.0.1:9
      - OLLAMA_MAX_RETRIES=0
      - OLLAMA_REQUEST_TIMEOUT_S=5
      - AGENT_API_KEY=${E2E_AGENT_API_KEY:-}
      - ANALYSIS_API_KEY=
      - GRAPH_API_KEY=
      - LSAT_API_KEY=
      # Admin HITL spec (BL-20260503-17): `seed_admin` provisions this login.
      - DJANGO_SUPERUSER_USERNAME=${E2E_ADMIN_USERNAME:-e2e-admin}
      - DJANGO_SUPERUSER_PASSWORD=${E2E_ADMIN_PASSWORD:-e2e-admin-pass}
      - REPO_ROOT=/repo
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      # This sidecar shares `backend`'s database, its staticfiles directory
      # (both mount ./backend:/app) and its checkpointer schema, and runs the
      # same collectstatic + migrate + ensure_checkpointer chain. `make
      # test-e2e` brings both up at once — frontend depends on backend — so on
      # a cold runner the two raced and this one lost, exiting 1 in the same
      # second backend reported healthy. Waiting for backend means the
      # migrations run once, and this container starts against a database
      # that is already migrated.
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./:/repo
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py ensure_checkpointer && python manage.py seed_admin && daphne -b 0.0.0.0 -p 8000 law_ai.asgi:application"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  e2e:
    # Official Playwright image (browsers + matching driver). The tag MUST
    # equal the @playwright/test version in frontend/package-lock.json —
    # tests/test_e2e_harness.py enforces it, because a mismatch fails at
    # runtime with a misleading "browser not found".
    #
    # The browser sees the stack exactly as a developer's does: a tiny TCP
    # forwarder (frontend/e2e/proxy.mjs, started by playwright.config.ts as
    # its webServer) maps localhost:3000 → frontend and localhost:8000 →
    # backend-e2e, so the frontend's baked-in http://localhost:8000 API base
    # and ws://localhost:8000 stream URL work unchanged.
    profiles: [ "e2e" ]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    environment:
      - E2E_FRONTEND_UPSTREAM=${E2E_FRONTEND_UPSTREAM:-frontend:3000}
      - E2E_BACKEND_UPSTREAM=${E2E_BACKEND_UPSTREAM:-backend-e2e:8000}
      - E2E_AGENT_API_KEY=${E2E_AGENT_API_KEY:-}
      - E2E_ADMIN_USERNAME=${E2E_ADMIN_USERNAME:-e2e-admin}
      - E2E_ADMIN_PASSWORD=${E2E_ADMIN_PASSWORD:-e2e-admin-pass}
      # Re-record e2e/a11y-baseline.json instead of asserting against it. The
      # spec documents this switch; without it here the variable never crossed
      # into the container and the documented re-record was a no-op.
      - E2E_A11Y_UPDATE_BASELINE=${E2E_A11Y_UPDATE_BASELINE:-}
      - CI=${CI:-}
    depends_on:
      frontend:
        condition: service_healthy
      backend-e2e:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Chromium is happier with the host IPC namespace (Playwright docs).
    ipc: host
    command: npx playwright test

  # ---------------------------------------------------------------------------
  # LangGraph Studio host (BL-20260502-01). Behind the `studio` profile, so
  # `make dev`, `make test` and `make down` never build or start it — the image
  # is heavy and the tier is opt-in. `make studio-up` is the entry point.
  #
  # Two things an operator must know before enabling it (docs/local-ai.md):
  #  1. The server validates LANGSMITH_API_KEY against beacon.langchain.com at
  #     boot, so it phones home. A free LangSmith account is enough.
  #  2. There is no open-source Studio UI: the visual stepper is hosted at
  #     smith.langchain.com/studio and connects back to this local server.
  # No prompt text leaves the machine for that (LANGSMITH_TRACING is off), but
  # the license ping does — which is why nothing here is on the product
  # runtime path (constitution §1 governs the runtime chain, not dev tools).
  # ---------------------------------------------------------------------------
  langgraph-db-init:
    profiles: [ "studio" ]
    image: postgres:16-alpine
    environment:
      - PGPASSWORD=law_ai-dev
    depends_on:
      postgres:
        condition: service_healthy
    # The Studio server runs its own migrations for threads/runs/assistants.
    # Give it a database of its own so those tables never share a schema with
    # Django's (and with the app's own LangGraph checkpoint tables).
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      psql -h postgres -U law_ai -d law_ai -tAc "SELECT 1 FROM pg_database WHERE datname='langgraph'" | grep -q 1
      || psql -h postgres -U law_ai -d law_ai -c "CREATE DATABASE langgraph"

  langgraph-api:
    profiles: [ "studio" ]
    build:
      context: ./backend
      dockerfile: Dockerfile.studio
    ports:
      - "2024:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      # Required by the self-hosted server; without it the container exits at
      # boot. Free developer key from smith.langchain.com.
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      # Trace export is opt-in and off by default: a debugging tool should not
      # ship this repo's prompts to a third party unless someone says so.
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - DATABASE_URI=postgres://law_ai:law_ai-dev@postgres:5432/langgraph?sslmode=disable
      # Separate Redis db from Celery's (0) so the two queues cannot collide.
      - REDIS_URI=redis://redis:6379/1
      # App wiring, same values the API uses.
      - DJANGO_SETTINGS_MODULE=law_ai.settings.dev
      - POSTGRES_URL=postgresql+asyncpg://law_ai:law_ai-dev@postgres:5432/law_ai
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=law_ai-dev
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      # Stepping through a graph re-runs its LLM nodes. Default the visual
      # tier to local Ollama so nobody bills a hosted provider by clicking
      # "resume" twenty times; override in .env when that is what you want.
      - LLM_PROVIDER_CHAIN=${STUDIO_LLM_PROVIDER_CHAIN:-ollama}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      langgraph-db-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    # No source bind-mount on purpose: the graph is baked into the image by
    # `pip install -e /deps/law-ai`, so a code change means `make studio-up`
    # again (it rebuilds). Live-reloading the server's own import path is not
    # worth the class of "Studio ran different code than the API" bug.
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
  ollama:
  phoenix:
