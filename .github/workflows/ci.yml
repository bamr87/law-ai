name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-gate:
    name: Spec Drift Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # backlog_lint.py compares against HEAD~1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate specs
        run: python scripts/spec_validator.py
      - name: Validate BACKLOG.md
        run: python scripts/backlog_lint.py

  clean-install-smoke:
    name: Clean-Install Import Smoke
    # Catches undeclared dependencies (PR #1, finding #1: lxml was a transitive
    # of beautifulsoup4 locally but not declared in pyproject.toml). Installs
    # the base package only — no [dev], no cache — and import-checks every
    # top-level Django app + each ingestion service entry point.
    runs-on: ubuntu-latest
    needs: spec-gate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Intentionally no cache: pip — we want a representative cold install.
      - name: Install package only (no extras)
        run: pip install -e .
      - name: Import-check public modules
        env:
          DJANGO_SETTINGS_MODULE: lawgraph.settings.test
          DATABASE_URL: sqlite:///./_smoke.sqlite3
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          AGENT_API_KEY: smoke
        run: |
          python - <<'PY'
          import importlib, django
          django.setup()  # required for Django ORM models
          modules = [
              # Pure Pydantic / utility modules — no Django
              "lawgraph.core.schemas",
              "lawgraph.core.schemas.legal_documents",
              "lawgraph.core.schemas.statute_extraction",
              "lawgraph.core.neo4j.statute_queries",
              "lawgraph.ingestionapp.quarantine_kinds",
              # Ingestion services — these are the modules that broke in PR #1
              # because of an undeclared lxml dependency.
              "lawgraph.ingestionapp.services.scout",
              "lawgraph.ingestionapp.services.statute_scout",
              "lawgraph.ingestionapp.services.colorado_statutes",
              "lawgraph.ingestionapp.services.courtlistener",
              # Django-dependent surfaces
              "lawgraph.ingestionapp.models",
              "lawgraph.ingestionapp.tasks",
              "lawgraph.audit.models",
              "lawgraph.asgi",  # boots the whole ASGI app + URLConf
          ]
          failed = []
          for m in modules:
              try:
                  importlib.import_module(m)
              except Exception as exc:  # noqa: BLE001
                  failed.append(f"{m}: {type(exc).__name__}: {exc}")
          if failed:
              print("CLEAN-INSTALL IMPORT FAILURES:")
              for line in failed:
                  print(f"  - {line}")
              raise SystemExit(1)
          print(f"OK: imported {len(modules)} modules from a clean install")
          PY

  backend-lint:
    name: Backend Lint + Type-check
    runs-on: ubuntu-latest
    needs: spec-gate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy app/ --strict
        continue-on-error: true # tighten once strict-clean

  backend-test:
    name: Backend Tests + Coverage
    runs-on: ubuntu-latest
    needs: spec-gate
    services:
      neo4j:
        image: neo4j:5-community
        ports: ["7687:7687"]
        env:
          NEO4J_AUTH: neo4j/testpassword
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: pytest -q --cov=lawgraph --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend Lint + Test
    runs-on: ubuntu-latest
    needs: spec-gate
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run

  legalbench:
    name: LegalBench Regression (changed reasoning only)
    runs-on: ubuntu-latest
    needs: backend-test
    if: contains(github.event.pull_request.labels.*.name, 'reasoning-change')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,legalbench]"
      - name: Run LegalBench subset
        run: python -m app.eval.legalbench --subset core_reasoning,precedent_retrieval
