name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/integration-tests.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/integration-tests.yml'
      - 'docker-compose.yml'

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Docker-backed Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        # BL-20260815-02: must stay a superset of backend/Dockerfile's extras
        # (`dev,local-ai,future-auth`) so an extras-only import cannot pass in the
        # container and fail here. `test` is this job's own addition.
        working-directory: backend
        run: pip install -e ".[dev,test,local-ai,future-auth]"

      - name: Start Docker services
        run: docker compose up -d neo4j postgres redis --wait

      - name: Apply Django migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://law_ai:law_ai-dev@localhost:5432/law_ai
          DJANGO_SETTINGS_MODULE: law_ai.settings.dev
        run: python manage.py migrate --noinput

      # BL-20260502-08: `make migrate` is migrate + migrate_neo4j +
      # ensure_checkpointer, and only the third creates the `langgraph` schema
      # the saver's `options=-csearch_path=langgraph` connection needs. This
      # job starts a fresh Postgres and tears the volume down with `down -v`,
      # so every run begins schema-less: without this step the opted-in
      # spec-010 T-007 test fails on its very first assertion with "no schema
      # has been selected to create in".
      - name: Create the LangGraph checkpointer schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://law_ai:law_ai-dev@localhost:5432/law_ai
          POSTGRES_URL: postgresql+asyncpg://law_ai:law_ai-dev@localhost:5432/law_ai
          LANGGRAPH_CHECKPOINTER: postgres
          DJANGO_SETTINGS_MODULE: law_ai.settings.dev
        run: python manage.py ensure_checkpointer

      - name: Run integration tests
        working-directory: backend
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: law_ai-dev
          DATABASE_URL: postgresql://law_ai:law_ai-dev@localhost:5432/law_ai
          # BL-20260502-08: opt in to the spec-010 T-007 Postgres checkpointer
          # test (backend/tests/agents/graphs/test_legal_workflow_postgres.py),
          # which skips itself at module level unless LANGGRAPH_INTEGRATION is
          # set. It injects a fake LLM, so no Ollama service is needed; it only
          # needs a reachable Postgres, which this job already starts.
          # POSTGRES_URL is the host-oriented form (settings.base defaults to
          # the compose hostname `postgres`).
          LANGGRAPH_INTEGRATION: "1"
          LANGGRAPH_CHECKPOINTER: postgres
          POSTGRES_URL: postgresql+asyncpg://law_ai:law_ai-dev@localhost:5432/law_ai
          # BL-20260511-09: same host-oriented rewrite as the three above.
          # pytest runs on the runner, not inside the compose network, so the
          # settings default (the compose hostname `redis`) does not resolve —
          # the ports are published, so localhost does.
          REDIS_URL: redis://localhost:6379/0
        # --no-cov: this job only runs ~3 tests, the 75% gate is enforced
        # by the main CI's Backend Tests + Coverage job (which runs everything
        # *except* integration). -o overrides addopts= in pyproject.toml.
        run: pytest -m integration -v --tb=short -o addopts="-ra --strict-markers" --no-cov

      - name: Teardown Docker services
        if: always()
        run: docker compose down -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: backend/.pytest_cache/
          retention-days: 7
