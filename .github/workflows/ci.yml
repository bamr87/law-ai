name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-gate:
    name: Spec Drift Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # backlog_lint.py compares against HEAD~1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate specs
        run: python scripts/spec_validator.py
      - name: Validate BACKLOG.md
        run: python scripts/backlog_lint.py

  backend-lint:
    name: Backend Lint + Type-check
    runs-on: ubuntu-latest
    needs: spec-gate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy app/ --strict
        continue-on-error: true # tighten once strict-clean

  backend-test:
    name: Backend Tests + Coverage
    runs-on: ubuntu-latest
    needs: spec-gate
    services:
      neo4j:
        image: neo4j:5-community
        ports: ["7687:7687"]
        env:
          NEO4J_AUTH: neo4j/testpassword
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: pytest -q --cov=lexgraph --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend Lint + Test
    runs-on: ubuntu-latest
    needs: spec-gate
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run

  legalbench:
    name: LegalBench Regression (changed reasoning only)
    runs-on: ubuntu-latest
    needs: backend-test
    if: contains(github.event.pull_request.labels.*.name, 'reasoning-change')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,legalbench]"
      - name: Run LegalBench subset
        run: python -m app.eval.legalbench --subset core_reasoning,precedent_retrieval
