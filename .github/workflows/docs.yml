name: Docs

# Generated documentation drift gate (ADR 0004). The Python API reference is
# rebuilt from source docstrings and the REST schema from the DRF views on
# every run, so a change that breaks an import or a docstring reference fails
# here. On push to main the built site is published to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - ".github/workflows/docs.yml"

# Allow publishing to GitHub Pages from the main branch.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (fails on warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend + docs toolchain
        run: pip install -e "backend[docs]"

      - name: Docstring-coverage gate
        run: make docs-coverage

      - name: Build Sphinx site (-W)
        # conf.py bootstraps Django under lawgraph.settings.test (SQLite, no
        # telemetry); DOCS_GIT_BRANCH makes the [source] links point at this rev.
        env:
          DOCS_GIT_BRANCH: ${{ github.sha }}
        run: make docs

      - name: Link check (non-blocking)
        continue-on-error: true
        run: make docs-linkcheck

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend reference (TypeDoc)
        working-directory: frontend
        run: |
          npm ci
          npm run docs

      - name: Assemble published site
        run: |
          mkdir -p docs/_build/html/frontend
          cp -r frontend/docs-api/* docs/_build/html/frontend/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Publish to GitHub Pages
    # Only publish from main; PRs just build to verify the docs stay in sync.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
