[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawgraph-ai"
version = "0.1.0"
description = "Open-source agent-orchestrated legal intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Spec 011 (ADR 0001): Django replaces FastAPI as the HTTP/orchestration layer
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "drf-pydantic>=2.7",
    "channels>=4.1",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "celery[redis]>=5.4",
    "django-environ>=0.11",
    "psycopg[binary,pool]>=3.2",
    "whitenoise>=6.7",
    # Domain layer (Pydantic) preserved
    "pydantic>=2.11.0,<2.13.0",
    "pydantic-settings>=2.10.0,<2.11.0",
    "crewai>=1.14.0",
    "langgraph>=1.1.0",
    "neo4j>=6.1.0",
    # Spec 011: kept for non-Django async DB callers (LangGraph checkpointer init,
    # legacy code paths that have not yet migrated to the Django ORM).
    "asyncpg>=0.31.0",
    "chromadb>=1.1.0,<1.2.0",
    "ollama>=0.6.0",
    "eyecite>=2.7.0",
    "spacy>=3.8.0",
    "redis>=5.2,<7.2",
    "httpx>=0.28.0",
    "tenacity>=9.1.0",
    # Spec 016: Justia CRS HTML parsing in
    # lawgraph/ingestionapp/services/colorado_statutes.py.
    "lxml>=5.3.0",
    # ADR 0004: serves the OpenAPI schema + Swagger/Redoc at /api/* and is
    # imported by lawgraph/urls.py + settings, so it is a base runtime dep.
    "drf-spectacular>=0.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
    "black>=26.3.0",
    "mypy>=1.20.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.0",
    "pytest-django>=4.9.0",
    "hypothesis>=6.150.0",
    "factory-boy>=3.3.0",
    "respx>=0.23.0",           # HTTP mocking
]
# Spec 011: planned per-user JWT/OAuth (BL-20260503-13). Not wired yet; install
# explicitly when implementing that spec.
future-auth = [
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "coverage[toml]>=7.6.0",
]
legalbench = [
    "datasets>=4.8.0",         # for LegalBench HF datasets
    "evaluate>=0.4.6",
]
local-ai = [
    # Spec 010 FR-1: lazy-imported by app.agents.graphs.* and
    # app.core.telemetry. The base install stays slim; install with
    #   pip install -e ".[dev,local-ai]"
    # to enable the LangGraph LegalWorkflow + Phoenix tracing.
    "langchain-ollama>=1.1.0",
    "langchain-core>=1.3.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langgraph-checkpoint-redis>=0.4.0",
    "psycopg[binary]>=3.3.0",
    "arize-phoenix-otel>=0.16.0",
    "opentelemetry-api>=1.34.0,<1.35.0",
    "opentelemetry-sdk>=1.34.0,<1.35.0",
    "opentelemetry-exporter-otlp-proto-http>=1.34.0,<1.35.0",
    "opentelemetry-instrumentation-django>=0.55b1,<0.56",
    "opentelemetry-instrumentation-httpx>=0.55b1,<0.56",
]
nlp = [
    # Blackstone pins spacy==2.1.8 which conflicts with our spacy>=3.7.
    # Install separately when you need the legal NER pipeline:
    #   pip install -e ".[nlp]"
    "blackstone @ git+https://github.com/ICLRandD/Blackstone.git",
]
docs = [
    # ADR 0004: Sphinx-based documentation. Auto-generates the Python API
    # reference from source docstrings + renders the existing docs/*.md as-is.
    #   pip install -e ".[docs]"  (then: make docs)
    "sphinx>=8.1",
    "myst-parser>=4.0",          # render docs/*.md (MyST/CommonMark)
    "sphinx-rtd-theme>=3.0",     # HTML theme
    "sphinxcontrib-mermaid>=1.0", # render embedded Mermaid diagrams
    "interrogate>=1.7",          # docstring-coverage drift gate
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lawgraph*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "PL", "RUF"]
# RUF012: Mutable class defaults are the documented DRF idiom for
# `permission_classes`, `authentication_classes`, etc. Adding ClassVar
# everywhere adds noise without changing semantics.
ignore = ["E501", "PLR0913", "PLR2004", "PLC0415", "PLW0603", "B008", "RUF003", "RUF012"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["neo4j.*", "crewai.*", "langgraph.*", "eyecite.*", "blackstone.*", "drf_pydantic.*", "channels.*", "channels_redis.*", "daphne.*", "environ.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "lawgraph.settings.test"
addopts = "-ra -q --strict-markers --cov=lawgraph --cov-report=term-missing:skip-covered --cov-fail-under=75"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast unit tests",
    "integration: tests that hit real DBs or APIs (require docker)",
    "legalbench: tests using LegalBench benchmark",
    "slow: tests that take >5s",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["lawgraph"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
# ---------------------------------------------------------------------------
# Docstring-coverage drift gate (ADR 0004, docs/documentation.md).
# AGENTS.md "Coding Standards" mandates docstrings on all public functions;
# `interrogate` enforces that quantitatively so the generated Sphinx API
# reference cannot silently drift from undocumented code.
# Threshold is a ratchet: raise `fail-under` as coverage improves, never lower.
# ---------------------------------------------------------------------------
[tool.interrogate]
fail-under = 55
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = true
ignore-nested-functions = true
ignore-property-decorators = true
ignore-module = false
ignore-semiprivate = true
exclude = ["tests", "scripts", "migrations", "var", "build", "manage.py"]
omit-covered-files = true
verbose = 1
