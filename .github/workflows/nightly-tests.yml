name: Nightly Tests & Autonomy

# Runs weekly on Monday at 06:00 UTC.  Also triggerable manually with an
# optional `dry_run` flag that skips the expensive Docker steps (coverage,
# LegalBench, synthesis) while still validating spec/backlog gates and
# opening the PR.
#
# NOTE: cadence was reduced from daily to weekly after 37/37 scheduled runs
# failed on hosted-runner disk exhaustion (0 MB free during `docker compose
# up` after building both app images). Restore daily cadence only after a
# sustained green streak.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Skip expensive steps (coverage, LegalBench, synthesis).
          Spec/backlog gates + PR plumbing still run so you can test the workflow.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # BL-20260503-14: the stale-backlog triage step opens/labels an issue.
  issues: write

jobs:
  nightly:
    name: Nightly Tests & Autonomy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------
      # Reclaim hosted-runner disk space BEFORE building. Every scheduled
      # run of this workflow died with "Free space left: 0 MB" during
      # `docker compose up` (see run 28644585073, 2026-07-03): the backend
      # image (chromadb/spacy/onnxruntime/crewai/langgraph) is multi-GB and
      # the standard ubuntu-latest runner only has ~14 GB free. Removing
      # the preinstalled Android SDK, .NET, GHC, and CodeQL toolcaches
      # reclaims ~25-30 GB.
      # ------------------------------------------------------------------
      - name: Free disk space on hosted runner
        if: ${{ !inputs.dry_run }}
        run: |
          echo "Disk before cleanup:" && df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          echo "Disk after cleanup:" && df -h /

      # ------------------------------------------------------------------
      # Build images once — reused by all make targets below.
      # ------------------------------------------------------------------
      - name: Build Docker images
        if: ${{ !inputs.dry_run }}
        run: docker compose build backend frontend

      # Drop the intermediate build cache once images exist — the layer
      # cache is not reused within this run and costs several GB.
      - name: Reclaim Docker build cache
        if: ${{ !inputs.dry_run }}
        run: |
          docker builder prune -f
          df -h /

      # ------------------------------------------------------------------
      # Infra services — needed by test-legalbench + autonomy-run.
      # ------------------------------------------------------------------
      - name: Start infrastructure services
        if: ${{ !inputs.dry_run }}
        run: docker compose up -d neo4j postgres redis ollama phoenix --wait

      # ------------------------------------------------------------------
      # Pull the LegalBench gate model (BL-20260511-26). Starting the Ollama
      # container is not enough: its model store is an empty named volume on
      # a fresh runner, so `make test-legalbench-gate` exits 2 ("could not
      # run — model not pulled") rather than producing a score. This is the
      # step whose absence meant the scored eval had never actually run in
      # CI.
      #
      # Only the gate model, deliberately: `make local-ai-pull` walks
      # OLLAMA_BOOTSTRAP_MODELS (~10 GB across three models) and the extra
      # two are not used by the eval. mistral:7b-instruct-q4_K_M is ~4.4 GB,
      # which the disk-cleanup step above leaves ample room for.
      # ------------------------------------------------------------------
      - name: Pull the LegalBench gate model
        if: ${{ !inputs.dry_run }}
        env:
          GATE_MODEL: mistral:7b-instruct-q4_K_M
        run: |
          docker compose exec -T ollama ollama pull "$GATE_MODEL"
          docker compose exec -T ollama ollama list
          df -h /

      # ------------------------------------------------------------------
      # Coverage — emits backend/coverage.xml via bind mount (./backend:/app).
      # evolve_audit.py reads coverage.xml to detect shortfalls.
      # ------------------------------------------------------------------
      - name: Run test coverage
        if: ${{ !inputs.dry_run }}
        run: make test-coverage

      # ------------------------------------------------------------------
      # LegalBench dataset cache (BL-20260811-09). The task items are never
      # vendored — the decision is "CI downloads at a pinned revision" — so
      # the gate below would score synthetic stubs without this step. The
      # cache key carries the revisions pinned in law_ai/eval/fetch.py, so a
      # revision bump invalidates it instead of re-benchmarking stale data.
      # ------------------------------------------------------------------
      - name: Resolve LegalBench dataset revision
        if: ${{ !inputs.dry_run }}
        id: legalbench-revision
        run: |
          echo "key=$(sha256sum backend/law_ai/eval/fetch.py backend/var/legalbench/manifest.json | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Restore cached LegalBench dataset
        if: ${{ !inputs.dry_run }}
        id: legalbench-cache
        uses: actions/cache@v4
        with:
          path: backend/var/legalbench/*/items.jsonl
          key: legalbench-items-${{ steps.legalbench-revision.outputs.key }}

      - name: Fetch LegalBench dataset (pinned revision, licence-checked)
        if: ${{ !inputs.dry_run && steps.legalbench-cache.outputs.cache-hit != 'true' }}
        run: make legalbench-cache

      # ------------------------------------------------------------------
      # LegalBench regression eval.
      # ------------------------------------------------------------------
      # Gating form (spec 031): exit 1 on a >1 pp drop vs baseline.json,
      # exit 2 when the eval could not run at all (Ollama down / model not
      # pulled) — previously an unreachable model scored every item wrong
      # and reported a cheerful accuracy of 0.0.
      - name: Run LegalBench eval (regression gate)
        if: ${{ !inputs.dry_run }}
        run: make test-legalbench-gate

      - name: Upload LegalBench reports + score history
        if: ${{ !inputs.dry_run && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: legalbench-${{ github.run_id }}
          path: |
            backend/var/legalbench/*.json
            backend/var/legalbench/history.jsonl
          retention-days: 90

      # BL-20260811-12: the score history was only ever a downloadable
      # artifact, which is where reviewers do not look. Render the last runs
      # into the run summary page instead. Stdlib python3 on the runner —
      # no container, and never fails the job.
      - name: Summarise LegalBench score history
        if: ${{ !inputs.dry_run && always() }}
        continue-on-error: true
        run: python3 scripts/legalbench_summary.py >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Browser end-to-end (spec 051 / BL-20260811-16). Nightly, not per-PR:
      # a full-stack boot plus a browser image is minutes, and the cheap half
      # of the boundary (the API contract gate) already runs in `make test`.
      # `backend-e2e` is pinned to an unreachable Ollama, so no model is
      # called and nothing is billed. See docs/e2e-testing.md.
      # ------------------------------------------------------------------
      - name: Run browser end-to-end suite
        if: ${{ !inputs.dry_run }}
        run: make test-e2e

      # ------------------------------------------------------------------
      # Live-network drift smoke (BL-20260511-07). One real Justia fetch per
      # run, re-parsed, so upstream HTML drift surfaces here instead of as a
      # silently empty corpus. continue-on-error on purpose: an upstream
      # outage is a warning, never a red nightly. Never add this to ci.yml.
      # ------------------------------------------------------------------
      - name: Run live-network drift smoke (Justia CRS)
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: make test-live-network

      - name: Upload Playwright report
        if: ${{ !inputs.dry_run && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      # ------------------------------------------------------------------
      # Spec / BACKLOG validators (host stdlib only — no container needed).
      # ------------------------------------------------------------------
      - name: Validate spec & backlog gates
        run: |
          python3 scripts/spec_validator.py
          python3 scripts/backlog_lint.py

      # ------------------------------------------------------------------
      # Stale-backlog triage issue (BL-20260503-14). The item asked for a
      # Celery beat job; that home is not viable — the production backend
      # image only COPYs backend/, so scripts/, specs/ and BACKLOG.md exist
      # in the worker container solely through the dev-only ./:/repo bind
      # mount, and the worker holds no GitHub credential. A workflow step
      # here has both the repo and a token.
      #
      # --stale-report never exits non-zero, so this can only ever open an
      # issue, never redden the run. The issue is idempotent: one open
      # `backlog: stale open items` issue at a time, commented on rather
      # than duplicated.
      # ------------------------------------------------------------------
      - name: Open a triage issue for stale backlog items
        if: ${{ github.event_name == 'schedule' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "backlog: stale open items need triage"
        run: |
          python3 scripts/backlog_lint.py --stale-report --stale-days 60 \
            | tee stale.md
          if grep -q '^No ## Open items older than' stale.md; then
            echo "Backlog is triaged; no issue needed."
            exit 0
          fi
          existing=$(gh issue list --state open --label backlog-triage \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue comment "$existing" --body-file stale.md
          else
            gh label create backlog-triage \
              --description "Stale BACKLOG.md items flagged by the nightly run" \
              --color ededed 2>/dev/null || true
            gh issue create --title "$TITLE" --label backlog-triage \
              --body-file stale.md
          fi

      # ------------------------------------------------------------------
      # Discovery audit — reads backend/coverage.xml + var/legalbench/.
      # Appends new BL-* entries to BACKLOG.md when regressions are found.
      # ------------------------------------------------------------------
      - name: Run discovery audit
        id: audit
        run: |
          python3 scripts/evolve_audit.py | tee audit.out
          # Detect a LegalBench severity:high item in this run's output.
          if grep -qE '\*, high\*' audit.out; then
            echo "regression=true"  >> "$GITHUB_OUTPUT"
          else
            echo "regression=false" >> "$GITHUB_OUTPUT"
          fi
          # Track whether BACKLOG.md was modified so we can include it in the PR.
          if git diff --quiet BACKLOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

      # Fail the workflow when a LegalBench regression is detected (constitution §8).
      - name: Fail on LegalBench severity:high regression
        if: steps.audit.outputs.regression == 'true'
        run: |
          echo "::error::evolve_audit detected a LegalBench severity:high regression — see audit.out artifact"
          cat audit.out
          exit 1

      # ------------------------------------------------------------------
      # Autonomy — synthesise proposed test files for lowest-coverage modules.
      # Uses make autonomy-run KIND=test_pillar (RUN_BACKEND_FULL → needs infra).
      # ------------------------------------------------------------------
      - name: Run autonomy test synthesis
        if: ${{ !inputs.dry_run }}
        # AUTONOMY_ENABLED must be set explicitly here: compose defaults it to
        # False (constitution §12 I3 kill-switch), so without this env the
        # synthesis step was a silent no-op on every scheduled run.
        # test_pillar needs no source allow-list (that gates corpus_growth).
        env:
          AUTONOMY_ENABLED: "True"
        run: make autonomy-run KIND=test_pillar

      # ------------------------------------------------------------------
      # Inventory proposed test files added by the synthesis step.
      # ------------------------------------------------------------------
      - name: Count proposed test files
        id: proposed
        run: |
          count=$(find backend/tests/autonomy/proposed -name "*.proposed.py" 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Proposed test files: $count"

      # ------------------------------------------------------------------
      # Compose the autonomy digest for THIS run (BL-20260511-19).
      #
      # `--window-to-now` matters: the default window is
      # [yesterday 00:00, today 00:00) UTC, so a digest composed inside a
      # 06:00 UTC run would contain none of the events the same run just
      # produced. Infra is still up here and AUTONOMY_ENABLED must be set
      # explicitly (compose defaults it to False per constitution §12 I3).
      # ------------------------------------------------------------------
      - name: Compose autonomy digest
        id: digest
        if: ${{ !inputs.dry_run && always() }}
        continue-on-error: true
        env:
          AUTONOMY_ENABLED: "True"
        run: |
          make autonomy-run KIND=digest ARGS=--window-to-now
          echo "path=backend/var/autonomy/digest-$(date -u +%F).md" >> "$GITHUB_OUTPUT"

      # The digest was only ever a file inside a container (and, at best, a
      # downloadable artifact) — which is where nobody looks. Render it into
      # the Actions run summary. `|| true` throughout: a missing digest must
      # never redden the nightly.
      - name: Post the autonomy digest to the run summary
        if: ${{ !inputs.dry_run && always() }}
        continue-on-error: true
        run: |
          {
            echo "## Autonomy digest"
            digest="${{ steps.digest.outputs.path }}"
            if [ -n "$digest" ] && [ -f "$digest" ]; then
              # Demote the digest's own H1 so it nests under the heading above.
              sed 's/^# /### /' "$digest" || true
            else
              echo "_No digest was composed for this run._"
            fi
            echo ""
            echo "## Discovery audit"
            echo '```'
            cat audit.out 2>/dev/null || echo "(no audit output)"
            echo '```'
            echo ""
            echo "Proposed test files: ${{ steps.proposed.outputs.count }}"
          } >> "$GITHUB_STEP_SUMMARY" || true

      # ------------------------------------------------------------------
      # Tear down services.
      # ------------------------------------------------------------------
      - name: Teardown Docker services
        if: ${{ always() && !inputs.dry_run }}
        run: docker compose down

      # ------------------------------------------------------------------
      # Artifacts.
      # ------------------------------------------------------------------
      - name: Upload coverage report
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_id }}
          path: |
            backend/htmlcov/
            backend/coverage.xml
          retention-days: 14

      - name: Upload evolve audit output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-${{ github.run_id }}
          path: audit.out
          retention-days: 14

      # The summary is ephemeral once the run ages out; keep the digest file
      # too so a later investigation still has it (BL-20260511-19).
      - name: Upload autonomy digest
        if: ${{ !inputs.dry_run && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: autonomy-digest-${{ github.run_id }}
          path: backend/var/autonomy/digest-*.md
          retention-days: 30
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # Open a draft PR when there are new proposed test files or BACKLOG
      # updates.  All proposed tests carry @pytest.mark.skip so nothing
      # breaks until a human reviews and promotes them.
      #
      # `!env.ACT` keeps `make nightly-dry-run` (nektos/act, which sets
      # ACT=true) from pushing a branch to the real repo while an engineer is
      # smoke-testing the workflow locally — BL-20260511-18.
      # ------------------------------------------------------------------
      - name: Open draft PR
        if: >-
          !env.ACT &&
          (steps.audit.outputs.changed == 'true' ||
           steps.proposed.outputs.count != '0')
        uses: peter-evans/create-pull-request@v8
        with:
          branch: nightly/auto-${{ github.run_id }}
          title: "chore(nightly): proposed tests + BACKLOG audit"
          draft: true
          commit-message: "chore(nightly): proposed tests + BACKLOG updates from nightly run"
          body: |
            Automated nightly run from `.github/workflows/nightly-tests.yml`.

            | Signal | Value |
            |---|---|
            | Proposed test files | ${{ steps.proposed.outputs.count }} |
            | BACKLOG updated | ${{ steps.audit.outputs.changed }} |
            | LegalBench regression | ${{ steps.audit.outputs.regression }} |

            **Proposed tests** (if any) are under `backend/tests/autonomy/proposed/`.
            All are decorated with `@pytest.mark.skip("autonomy-proposed")`.
            Review each file, remove the skip decorator, and move to the
            appropriate test module before merging.

            **BACKLOG entries** (if any) are appended under `## Open` in `BACKLOG.md`.

            See the `audit-${{ github.run_id }}` artifact for the full discovery
            audit output.
          labels: |
            autonomy
            nightly
