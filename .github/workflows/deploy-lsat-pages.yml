# Deploy the static LSAT practice app to GitHub Pages (spec 025 FR-9).
#
# Serverless by design: the site is a committed, buildless artifact
# (frontend/public/lsat-practice — vanilla HTML/CSS/JS + content.json
# generated by `make lsat-export` and drift-gated by tests/test_lsat_site.py),
# so this workflow only uploads and deploys. No build step, no secrets beyond
# the built-in GITHUB_TOKEN.
#
# One-time repo setup: Settings → Pages → Source: "GitHub Actions".

name: deploy-lsat-pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/public/lsat-practice/**"
      - ".github/workflows/deploy-lsat-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a production deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity-check the artifact
        run: |
          test -f frontend/public/lsat-practice/index.html
          test -f frontend/public/lsat-practice/data/content.json
          python3 -c "
          import json
          blob = json.load(open('frontend/public/lsat-practice/data/content.json'))
          total = blob['counts']['total']
          assert total == len(blob['questions']) > 0, 'empty or inconsistent content.json'
          print(f'deploying {total} questions, {len(blob[\"passages\"])} passages')
          "

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public/lsat-practice

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
