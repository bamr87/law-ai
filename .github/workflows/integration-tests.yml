name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/integration-tests.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/integration-tests.yml'
      - 'docker-compose.yml'

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Docker-backed Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev,test]"

      - name: Start Docker services
        run: docker compose up -d neo4j postgres redis --wait

      - name: Apply Django migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://law_ai:law_ai-dev@localhost:5432/law_ai
          DJANGO_SETTINGS_MODULE: law_ai.settings.dev
        run: python manage.py migrate --noinput

      - name: Run integration tests
        working-directory: backend
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: law_ai-dev
          DATABASE_URL: postgresql://law_ai:law_ai-dev@localhost:5432/law_ai
        # --no-cov: this job only runs ~3 tests, the 75% gate is enforced
        # by the main CI's Backend Tests + Coverage job (which runs everything
        # *except* integration). -o overrides addopts= in pyproject.toml.
        run: pytest -m integration -v --tb=short -o addopts="-ra --strict-markers" --no-cov

      - name: Teardown Docker services
        if: always()
        run: docker compose down -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: backend/.pytest_cache/
          retention-days: 7
