# kit: sdlc v0.1.0 — the repo's SDLC declaration (UPS-WORK-01). Lands at .github/sdlc.yml.
# Contract: templates/sdlc/sdlc.schema.json in bamr87/bamr87 (validated by the conformance check).
# The hub registry (_data/projects.yml `sdlc:` block) may mirror these keys; when both exist,
# this file wins.
schema: sdlc/v1

# Repo type (decision D6): the platform (Django API + Next.js apps) is several things at once.
type: app
kinds: [app, api]
tier: experiment          # matches the hub registry's `status: experiment`

backlog:
  mode: file              # decision D1 exception: the spec-driven backlog is a file, linted in CI
  file: BACKLOG.md
  mirror_to_issues: false

# Optional modules. Always a map of name -> true/false (never a list).
modules:
  spec_driven: true       # specs/NNN-slug/{spec,plan,tasks}.md + BACKLOG.md, gated BY REFERENCE through
                          # the hub's reusable spec-gate.yml and the spec-driven Claude Code plugin
                          # (docs/spec-driven.md); nothing from the kit is vendored except tools/fleet-kit.sh
  adr: true               # docs/adr/ (UPS-WORK-04)
  features: false         # no features/features.yml yet (UPS-QA-50..53)
  issue_autopilot: false
  content_queue: false
  ai_lanes: false

adr_path: docs/adr

release:
  type: python            # backend/pyproject.toml carries the version; no release-please caller yet

# Waived requirements, each also listed in AGENTS.md § Standard deviations.
deviations: []
