name: Evolve (weekly autopilot)

# Runs the headless half of /evolve every Monday 13:00 UTC.
# - Audits the repo for follow-ups, appends them to BACKLOG.md.
# - Opens a PR with the new BL-* entries so a human (or Copilot coding agent)
#   can pick the next /evolve cycle.
# - Optionally files a tracking issue tagged for the GitHub Copilot coding
#   agent — assigning that issue to @copilot will run /evolve in the cloud.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    # Kill switch (BL-20260818-02). gitorio's `*_ENABLED` convention is
    # default-OFF, and specs/038-framework-hardening deliberately did not
    # backport it here (NG1): a default-OFF gate would have silently idled a
    # live weekly automation, and a workflow that quietly does nothing is
    # worse than one that has no switch at all — you cannot tell the two
    # apart from the runs list.
    #
    # So this is an opt-OUT gate. `vars.EVOLVE_ENABLED` unset evaluates to the
    # empty string, which is `!= 'false'`, so existing scheduled runs are
    # unaffected. Set the repository variable EVOLVE_ENABLED=false
    # (Settings → Secrets and variables → Actions → Variables) to idle the
    # weekly autopilot without deleting the workflow; unset or set it to
    # anything else to resume. Flipping to default-OFF later is a one-word
    # change and is the part that needs the maintainer's call.
    if: ${{ vars.EVOLVE_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install minimal deps for audit
        run: pip install coverage

      - name: Run discovery audit
        id: audit
        run: |
          # Default runner shell is `bash -e` WITHOUT pipefail, so tee's exit 0
          # would mask an audit crash into an eternally-green weekly run.
          set -o pipefail
          python scripts/evolve_audit.py | tee audit.out
          # Capture the log as a real step output — the PR body interpolates
          # steps.audit.outputs.audit, which was never set before (spec 038).
          {
            echo 'audit<<AUDIT_EOF'
            cat audit.out
            echo 'AUDIT_EOF'
          } >> "$GITHUB_OUTPUT"
          if git diff --quiet BACKLOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate gates still pass
        if: steps.audit.outputs.changed == 'true'
        run: |
          python scripts/spec_validator.py
          python scripts/backlog_lint.py

      - name: Open PR with new BACKLOG entries
        if: steps.audit.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Stable branch so weekly re-runs update the SAME PR instead of opening
          # a fresh one every run (the old ${{ github.run_id }} branch piled up 6
          # stale duplicate PRs). add-paths limits the commit to BACKLOG.md so the
          # transient audit.out scratch file is never committed.
          branch: evolve/weekly-backlog-audit
          add-paths: |
            BACKLOG.md
          title: "chore(evolve): weekly BACKLOG audit"
          commit-message: "chore(evolve): append discovered follow-ups"
          body: |
            Automated discovery run from `scripts/evolve_audit.py`.

            ```
            ${{ steps.audit.outputs.audit }}
            ```

            **Next step:** assign the companion tracking issue to `@copilot`
            to run `/evolve` against the highest-priority new item, or run
            `/evolve` locally in Copilot Chat.
          labels: |
            evolve
            backlog

      - name: File tracking issue for Copilot coding agent
        if: steps.audit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotency: skip filing a new tracking issue if an 'evolve' issue is
          # already open (the old unconditional create piled up 6 stale issues).
          if [ "$(gh issue list --label evolve --state open --json number --jq 'length')" -gt 0 ]; then
            echo "An open 'evolve' issue already exists — skipping issue creation."
            exit 0
          fi
          gh issue create \
            --title "evolve: run /evolve on top BACKLOG item" \
            --label evolve \
            --body "$(cat <<'EOF'
          The weekly audit appended new BACKLOG entries.

          To advance the repo, follow [prompts/evolve.md](../blob/main/prompts/evolve.md):
          1. Pick the highest-severity item under `## Open` in `BACKLOG.md`.
          2. Run `/specify` → `/clarify` → `/plan` → `/tasks` → `/implement`.
          3. Mirror new follow-ups back into `BACKLOG.md`.

          Assign this issue to `@copilot` to have the GitHub Copilot coding
          agent execute the cycle in the cloud.
          EOF
          )"
