name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas the diff touches so the expensive backend/frontend
  # jobs (service containers, full npm ci) skip on docs/config-only changes.
  # spec-gate and repo-structural still run on every push/PR.
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      lsat-static: ${{ steps.filter.outputs.lsat-static }}
      visual: ${{ steps.filter.outputs.visual }}
      lsat-content: ${{ steps.filter.outputs.lsat-content }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              # BL-20260429-04: backend-lint runs this, so a change to it has
              # to re-run the job even when no backend/ file moved.
              - 'scripts/mypy_ratchet.py'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            lsat-static:
              - 'lsat-static/**'
              - '.github/workflows/ci.yml'
            # BL-20260702-11: the LSAT source bank. refresh-lsat-content.yml
            # re-exports lsat-static/content.json and pushes it onto the PR
            # branch for exactly this diff, so the drift gate below defers
            # instead of demanding a manual `make lsat-export`.
            lsat-content:
              - 'backend/law_ai/lsat/services/data/**'
            # BL-20260905-05: anything a reviewer would need to *see*.
            # Deliberately does NOT include ci.yml — a workflow edit is not a
            # visual change, and including it would demand a screenshot of
            # every CI tweak.
            visual:
              - 'frontend/**'
              - 'lsat-static/**'

  spec-gate:
    name: Spec Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # In CI the checked-out worktree IS HEAD, so the append-only diff
          # must run against the parent (BACKLOG_LINT_BASE below); depth 2
          # makes HEAD^1 available (previous commit on push; base-branch tip
          # on a PR merge commit).
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate specs
        # --strict (BL-20260906-48): the constitution §13 review-question
        # warnings fail the gate here rather than printing into a log nobody
        # reads. Shipped specs are exempt inside the validator, so this only
        # ever fires on a spec whose author can still answer the question.
        run: python scripts/spec_validator.py --strict
      - name: Validate BACKLOG.md
        run: python scripts/backlog_lint.py
        env:
          BACKLOG_LINT_BASE: HEAD^1
      - name: Audit the UI/UX shell contract
        # Static, stdlib-only, no node_modules — the mechanical half of the
        # /ux-review loop (docs/ui-ux-review.md).
        run: python scripts/ux_audit.py

  repo-structural:
    name: Repo Structural Tests (docs / specs / configs)
    # The root tests/ smoke+specs tier validates docs, specs, backlog, configs,
    # and repo structure. It is dependency-light by design (tests/conftest.py):
    # no Docker, Neo4j, or node_modules — just pytest. The heavier backend/
    # frontend subprocess suites are excluded via markers.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [spec-gate, changes]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
        # PyYAML beside pytest: the config gates parse .github/workflows/*.yml
        # and docker-compose.yml, and regexing a workflow file asserts on
        # indentation rather than on meaning. Both are pure Python, so the
        # suite's "no Docker, no Neo4j, no node_modules" promise still holds;
        # without PyYAML those tests skip rather than fail (tests/conftest.py
        # require_yaml), which is why this line is load-bearing.
      - run: pip install pytest pyyaml
      - name: Run root structural suite (smoke + specs)
        env:
          # BL-20260702-11: on a same-repo PR that edits the LSAT bank,
          # refresh-lsat-content.yml re-exports content.json and pushes it onto
          # this very branch. Failing here as well would mean the developer
          # still has to run `make lsat-export` by hand to get a green run —
          # which is the manual step the item asked to remove. So the drift
          # assertions defer to that job, and ONLY there: a fork PR (where the
          # job cannot push), a push to main, and every local run still
          # enforce them.
          LSAT_CONTENT_AUTOEXPORT: >-
            ${{ (github.event_name == 'pull_request' &&
                 needs.changes.outputs.lsat-content == 'true' &&
                 github.event.pull_request.head.repo.full_name ==
                 github.repository) && '1' || '' }}
        run: pytest tests/ -m "not backend and not frontend" -q

  clean-install-smoke:
    name: Clean-Install Import Smoke
    # Catches undeclared dependencies (PR #1, finding #1: lxml was a transitive
    # of beautifulsoup4 locally but not declared in pyproject.toml). Installs
    # the base package only — no [dev], no cache — and import-checks every
    # top-level Django app + each ingestion service entry point.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [spec-gate, changes]
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Intentionally no cache: pip — we want a representative cold install.
      - name: Install package only (no extras)
        run: pip install -e .
      - name: Import-check public modules
        env:
          DJANGO_SETTINGS_MODULE: law_ai.settings.test
          DATABASE_URL: sqlite:///./_smoke.sqlite3
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          AGENT_API_KEY: smoke
        run: |
          python - <<'PY'
          import importlib, django
          django.setup()  # required for Django ORM models
          modules = [
              # Pure Pydantic / utility modules — no Django
              "law_ai.core.schemas",
              "law_ai.core.schemas.legal_documents",
              "law_ai.core.schemas.statute_extraction",
              "law_ai.core.neo4j.statute_queries",
              "law_ai.ingestionapp.quarantine_kinds",
              # Ingestion services — these are the modules that broke in PR #1
              # because of an undeclared lxml dependency.
              "law_ai.ingestionapp.services.scout",
              "law_ai.ingestionapp.services.statute_scout",
              "law_ai.ingestionapp.services.colorado_statutes",
              "law_ai.ingestionapp.services.courtlistener",
              # Django-dependent surfaces
              "law_ai.ingestionapp.models",
              "law_ai.ingestionapp.tasks",
              "law_ai.audit.models",
              "law_ai.asgi",  # boots the whole ASGI app + URLConf
          ]
          failed = []
          for m in modules:
              try:
                  importlib.import_module(m)
              except Exception as exc:  # noqa: BLE001
                  failed.append(f"{m}: {type(exc).__name__}: {exc}")
          if failed:
              print("CLEAN-INSTALL IMPORT FAILURES:")
              for line in failed:
                  print(f"  - {line}")
              raise SystemExit(1)
          print(f"OK: imported {len(modules)} modules from a clean install")
          PY

  backend-lint:
    name: Backend Lint + Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [spec-gate, changes]
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # BL-20260815-02: keep these extras a superset of
      # backend/Dockerfile's, or an extras-only import (core.telemetry's
      # lazy Phoenix/OTel imports) passes in the container and dies here.
      # tests/test_configs.py::test_ci_extras_match_dockerfile enforces it.
      - run: pip install -e ".[dev,local-ai,future-auth]"
      - run: ruff check .
      - run: black --check .
      # BL-20260429-04: this used to be a bare `mypy law_ai --strict` with
      # `continue-on-error: true`, i.e. no gate at all. It is now ratcheted
      # against backend/mypy-baseline.txt: the run fails if any file's strict
      # error count grows, or if a file the baseline calls clean stops being
      # clean. New code has to be strict-clean; the legacy backlog is burned
      # down file by file (`make mypy-baseline` re-banks it).
      - name: mypy --strict (ratcheted against backend/mypy-baseline.txt)
        run: python3 ../scripts/mypy_ratchet.py --run

  backend-test:
    name: Backend Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [spec-gate, changes]
    if: needs.changes.outputs.backend == 'true'
    services:
      neo4j:
        image: neo4j:5-community
        ports: ["7687:7687"]
        env:
          NEO4J_AUTH: neo4j/testpassword
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # BL-20260815-02: keep these extras a superset of
      # backend/Dockerfile's, or an extras-only import (core.telemetry's
      # lazy Phoenix/OTel imports) passes in the container and dies here.
      # tests/test_configs.py::test_ci_extras_match_dockerfile enforces it.
      # `nlp` (BL-20260429-03) is on top of that superset: backend/Dockerfile
      # installs the same en_core_web_sm wheel in its own `--no-deps` layer, and
      # the `nlp`-marked tests load the real pipeline rather than skipping when
      # it is absent — a silently missing model is the failure they exist to
      # catch. Extras beyond the Dockerfile's are allowed by that same test.
      - run: pip install -e ".[dev,local-ai,nlp,future-auth]"
      - name: Run pytest with coverage
        # Integration tests require Docker fixtures that aren't available here;
        # they run in the dedicated 'Docker-backed Integration Tests' workflow.
        run: pytest -q -m "not integration" --cov=law_ai --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [spec-gate, changes]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run

  lsat-static:
    name: LSAT Static Site Type-check + Test
    # The static export has no compose service and its own package.json
    # (`make test-lsat-static` locally). Vitest + RTL landed with
    # BL-20260831-18; before that the site was verified only by the root
    # structural suite and by hand.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [spec-gate, changes]
    if: needs.changes.outputs.lsat-static == 'true'
    defaults:
      run:
        working-directory: lsat-static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lsat-static/package-lock.json
      - run: npm ci
      # BL-20260905-15: this package had no eslint config, so `npm run lint`
      # was an unconfigured `next lint` and the job gated on types + vitest
      # alone. It now runs the same flat config the platform app does.
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run

  legalbench:
    name: LegalBench harness check (changed reasoning only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-test
    if: contains(github.event.pull_request.labels.*.name, 'reasoning-change')
    defaults:
      run:
        working-directory: backend
    # This job used to invoke `python -m app.eval.legalbench` — the
    # pre-rebrand package path, which no longer exists — with no Ollama
    # service and no assertion on the result, so it could only ever have
    # failed or measured nothing (BL-20260810-04). PR-time runners cannot
    # host a multi-GB model (see nightly-tests.yml, which had to drop to a
    # weekly cadence over disk exhaustion), so the *measurement* lives in
    # the nightly job; this job verifies the harness itself is sound.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # BL-20260815-02: keep these extras a superset of
      # backend/Dockerfile's, or an extras-only import (core.telemetry's
      # lazy Phoenix/OTel imports) passes in the container and dies here.
      # tests/test_configs.py::test_ci_extras_match_dockerfile enforces it.
      - run: pip install -e ".[dev,local-ai,future-auth]"
      - name: Verify the eval harness (scoring, paths, regression gate)
        run: pytest tests/eval -q
      - name: Remind reviewers where the real measurement runs
        run: |
          echo "::notice::Harness verified. The scored LegalBench run with a" \
               "real model happens in the nightly workflow" \
               "(make test-legalbench), which gates on --check-regression."

  # ---------------------------------------------------------------------------
  # Accessibility gate (BL-20260831-09). `scripts/ux_audit.py` in spec-gate is
  # a stdlib grep: it cannot compute a contrast ratio, resolve an accessible
  # name through ARIA, or watch focus move. axe-core in a real browser can, and
  # the item asked for that on every PR — not once a week in a nightly nobody
  # reads. It runs only when the diff touches frontend/, and it runs the same
  # `make test-e2e` path a developer runs locally, against the same pinned
  # `backend-e2e` sidecar (unreachable Ollama ⇒ no model is ever called).
  #
  # The disk-reclaim step is not superstition: the nightly workflow had to drop
  # from daily to weekly after 37 consecutive runs died with 0 MB free while
  # building both app images. Deleting the preinstalled toolchains the runner
  # image ships buys ~25 GB, which is the difference between this gate working
  # and this gate being switched off.
  # ---------------------------------------------------------------------------
  a11y:
    name: Accessibility Smoke (axe-core, catalog routes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [spec-gate, changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          df -h /
      - name: Run the axe-core smoke over every catalog route
        run: make test-e2e E2E_ARGS='e2e/a11y.spec.ts'
      - name: Dump container logs
        # `compose up --wait` reports "container X exited (1)" and nothing
        # else, so a stack that dies on boot is undiagnosable from the run
        # log alone — which cost a full round trip the first time it happened.
        if: failure()
        run: docker compose --profile e2e logs --no-color --tail=120 || true
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Visual-evidence gate (BL-20260905-05). The screenshot convention was prose
  # in AGENTS.md plus a PR-template section, so a PR could rewrite every screen
  # and attach nothing. Pull-request only: a push to main has no body to read.
  #
  # Opt out with the `no-visual-change` label for changes that genuinely have
  # no visual effect. Fork contributors cannot label their own PR, so the
  # gate's second branch — a new or changed file under docs/images/ — stays as
  # the label-free escape hatch.
  # ---------------------------------------------------------------------------
  visual-evidence:
    name: Visual Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.visual == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'no-visual-change')
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate diffs against the PR base, so the merge-base must exist.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect the changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | tee changed.txt
      - name: Require a screenshot or a docs/images change
        env:
          # Body text is untrusted input; passing it through the environment
          # rather than interpolating it into the shell keeps a PR title/body
          # from becoming a script injection.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/visual_evidence_gate.py --changed-files changed.txt
