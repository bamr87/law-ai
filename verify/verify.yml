# =============================================================================
# verify/verify.yml — how to run law-ai the way a USER would
# =============================================================================
# kit: verify v0.1.0 (seeded from bamr87/bamr87 templates/verify/)
#
# Read by three consumers, so it is the one place "how do I start this thing and
# where do I look" is written down:
#   1. verify/runner.mjs            — executes verify/scenarios/*.yml with Playwright
#   2. fleet-verify.yml (reusable)  — starts the app in CI, runs the runner, and
#                                     (on `verify`-labelled PRs) hands the live
#                                     app to a Claude Code pass via the Playwright MCP
#   3. .claude/skills/verify-feature — the agent skill that drives it locally
#
# WHAT RUNS HERE: the static LSAT edition (lsat-static/, LAWAI-005), the same
# Next.js export deploy-lsat-pages.yml publishes to GitHub Pages. The platform
# (`make dev`: Django + Channels + Celery, Next.js, Postgres, Neo4j, Redis,
# Ollama) is multi-GB of images and minutes of start-up, too heavy for a PR job,
# so the scenarios run against the one surface CI can build and serve on its own.
#
# The build sets PAGES_BASE_PATH empty so the export is served at the root of
# app.url; Pages serves it under /law-ai/ instead (next.config.mjs).
#
# Locally (Docker-first, AGENTS.md), build the same export with
#   docker run --rm -v "$PWD":/repo -w /repo/lsat-static -e PAGES_BASE_PATH= \
#     node:20-alpine sh -c "npm install --no-audit --no-fund && npm run build"
# then serve lsat-static/out on :4000 and run `node verify/runner.mjs` against it.
# =============================================================================
schema: verify/v1

app:
  # Command that serves the app (run from the repo root, in the background).
  # Empty: `static_dir` is served by python http.server on app.url's port.
  start: ""
  # One-shot build before serving `static_dir`: the static export, at the root.
  build: "cd lsat-static && PAGES_BASE_PATH= npm run build"
  # The export `next build` writes (output: 'export').
  static_dir: lsat-static/out
  # Base URL the scenarios navigate against.
  url: http://127.0.0.1:4000
  # Path polled until it answers 200 before any scenario runs.
  ready: /
  # Seconds to wait for `ready`.
  timeout_s: 180
  # The repo root has no package.json; the app's manifest is lsat-static's.
  install: "cd lsat-static && npm install --no-audit --no-fund"

# Named viewports scenarios can reference by name.
viewports:
  desktop: { width: 1280, height: 800 }
  tablet: { width: 768, height: 1024 }
  mobile: { width: 390, height: 844 }

# Where things live (relative to the repo root).
features: features/features.yml
scenarios: verify/scenarios
evidence_dir: test/evidence

# The agent pass (fleet-verify.yml with `agent: true`, or the verify-feature skill).
agent:
  # Routes the agent should start from when exploring beyond the scenarios.
  # The static edition is one page; its views (Overview, LR, RC, LG, Writing,
  # Library, Stats) are switched from the header nav.
  entry_routes: ["/"]
  # Things the agent must never do against this app (it reads this list).
  never:
    - "submit forms that send email or create real records against a shared backend"
    - "sign in with real credentials"
