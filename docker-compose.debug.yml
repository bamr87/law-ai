# Docker Compose override that enables debugger attach for backend, worker, and frontend.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up
# Then attach via .vscode/launch.json:
#   - "Docker: Attach to backend (debugpy)"  → port 5678
#   - "Docker: Attach to worker (debugpy)"   → port 5679
#   - "Docker: Attach to frontend (Next.js node)" → port 9229

services:
  backend:
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             python manage.py ensure_checkpointer &&
             python -m debugpy --listen 0.0.0.0:5678
             -m daphne -b 0.0.0.0 -p 8000 lawgraph.asgi:application"
    ports:
      - "8000:8000"
      - "5678:5678"

  worker:
    command: >
      python -m debugpy --listen 0.0.0.0:5679 -m celery -A lawgraph worker -l info
    ports:
      - "5679:5679"

  frontend:
    command: sh -c "node --inspect=0.0.0.0:9229 node_modules/.bin/next dev"
    ports:
      - "3000:3000"
      - "9229:9229"
