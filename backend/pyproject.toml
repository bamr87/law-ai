[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "law-ai"
version = "0.1.0"
description = "Open-source agent-orchestrated legal intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Spec 011 (ADR 0001): Django replaces FastAPI as the HTTP/orchestration layer
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "drf-pydantic>=2.7",
    "channels>=4.1",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "celery[redis]>=5.4",
    "django-environ>=0.11",
    "psycopg[binary,pool]>=3.2",
    "whitenoise>=6.7",
    # Domain layer (Pydantic) preserved
    "pydantic>=2.11.0,<2.13.0",
    "pydantic-settings>=2.10.0,<2.11.0",
    "crewai>=1.14.0",
    # Spec 035: LangChain + LangGraph are core stack, not extras — the default
    # analysis engine is a LangGraph StateGraph, its Postgres checkpointer is
    # provisioned at container boot (ensure_checkpointer), and the LangChain
    # chat-model layer fronts the LLM provider chain (constitution §1).
    "langgraph>=1.1.0",
    "langchain-core>=1.3.0",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langgraph-checkpoint-redis>=0.4.0",
    "neo4j>=6.1.0",
    # Spec 011: kept for non-Django async DB callers (LangGraph checkpointer init,
    # legacy code paths that have not yet migrated to the Django ORM).
    "asyncpg>=0.31.0",
    "chromadb>=1.1.0,<1.2.0",
    "ollama>=0.6.0",
    "eyecite>=2.7.0",
    "spacy>=3.8.0",
    # PDF fallback for statute publications (BL-20260509-06)
    "pypdf>=5.1.0",
    "redis>=5.2,<7.2",
    "httpx>=0.28.0",
    "tenacity>=9.1.0",
    # Spec 016: Justia CRS HTML parsing in
    # law_ai/ingestionapp/services/colorado_statutes.py.
    "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "debugpy>=1.8.0",  # docker-compose.debug.yml: python -m debugpy
    "ruff>=0.15.0",
    "black>=26.3.0",
    "mypy>=1.20.0",
    # BL-20260429-04: type stubs + mypy plugins for Django and DRF. Without
    # them `mypy law_ai --strict` reports ~115 import-untyped errors and every
    # `models.Model` / `AppConfig` / `APIView` subclass as "cannot subclass
    # (has type Any)". Deliberately NOT the `[compatible-mypy]` extra: it pins
    # mypy to the stub release's range and would pull this image's mypy back.
    "django-stubs>=6.1.0",
    "djangorestframework-stubs>=3.18.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.0",
    "pytest-django>=4.9.0",
    "hypothesis>=6.150.0",
    "factory-boy>=3.3.0",
    "respx>=0.23.0",           # HTTP mocking
]
# BL-20260503-13: the OAuth2 bearer grant over `core.ApiToken`
# (`law_ai/core/jwt_auth.py`). No longer optional in practice — backend/Dockerfile
# installs this extra, and `law_ai.core.auth.ApiKeyAuthentication` degrades to
# key+session only when it is absent. It stays an extra so a deployment that
# wants neither library can still build without them.
future-auth = [
    "python-jose[cryptography]>=3.5.0",
    # Not `passlib[bcrypt]`: passlib 1.7.4 probes its bcrypt backend with a
    # 73-byte password and bcrypt>=4.1 raises on that, so importing the
    # bcrypt scheme fails outright. core/jwt_auth.py uses passlib's own
    # pbkdf2_sha256 instead, which needs no compiled backend.
    "passlib>=1.7.4",
]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "coverage[toml]>=7.6.0",
]
legalbench = [
    "datasets>=4.8.0",         # for LegalBench HF datasets
    "evaluate>=0.4.6",
]
local-ai = [
    # Spec 035 moved the LangChain/LangGraph runtime deps into core
    # `dependencies` — the LangGraph engine and its checkpointer are not
    # optional. What remains here is Phoenix/OTel tracing, which the app
    # genuinely degrades without (core.telemetry lazy-imports it).
    "arize-phoenix-otel>=0.16.0",
    "opentelemetry-api>=1.34.0,<1.35.0",
    "opentelemetry-sdk>=1.34.0,<1.35.0",
    "opentelemetry-exporter-otlp-proto-http>=1.34.0,<1.35.0",
    "opentelemetry-instrumentation-django>=0.55b1,<0.56",
    "opentelemetry-instrumentation-httpx>=0.55b1,<0.56",
]
nlp = [
    # Optional NER pass for IngestionScout (BL-20260429-03), gated behind
    # ENABLE_NER. backend/Dockerfile installs this wheel into the image, so the
    # Docker-first workflow needs no extra step; `pip install -e ".[nlp]"` is
    # the equivalent for a non-container install.
    #
    # This extra used to carry Blackstone. It cannot be installed here:
    # Blackstone pins spacy==2.1.8 against this project's spacy>=3.8.0, and
    # spaCy 2.1 / thinc 7 ship no wheels for the Python 3.12 base image.
    # Upstream ICLRandD/Blackstone last pushed 2024-07 (see
    # docs/related-github-repos.md), so the pin will not move on its own.
    # law_ai/ingestionapp/services/ner.py implements the lazy shim the item
    # asked for on spaCy 3's en_core_web_sm instead.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

# Spec 053: the ocrmd scanner as an optional library (ENABLE_OCRMD). Not in the default
# image — `INSTALL_OCRMD=1 docker compose build backend` adds it — because it pins opencv
# (which needs libGL in the container), pulls an ONNX runtime, and is pinned to a git ref
# until ocrmd is on PyPI. RapidOCR is the engine on Linux (Apple Vision is macOS-only);
# pymupdf renders PDFs. Inside Law AI it runs OCR only: see
# law_ai/ingestionapp/services/ocrmd_plugin.py. License: MIT (ocrmd), Apache-2.0
# (rapidocr, onnxruntime), AGPL-3.0 (pymupdf — optional; drop it to lose PDF ingest).
ocrmd = [
    "ocrmd @ git+https://github.com/bamr87/ocrmd@main",
    "rapidocr>=3.0",
    "onnxruntime>=1.20",
    "pymupdf>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["law_ai*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "PL", "RUF"]
# RUF012: Mutable class defaults are the documented DRF idiom for
# `permission_classes`, `authentication_classes`, etc. Adding ClassVar
# everywhere adds noise without changing semantics.
ignore = ["E501", "PLR0913", "PLR2004", "PLC0415", "PLW0603", "B008", "RUF003", "RUF012"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
# BL-20260429-04: Django/DRF stubs carry mypy plugins that teach mypy about
# model metaclasses, `Manager`/`QuerySet` generics and DRF's view hierarchy.
# Without them every Django subclass is "subclass of Any" and every
# `from django...` import is `import-untyped`.
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
# The plugin imports this settings module to resolve model fields. `test` is
# the only one that boots with no services and no env (it defaults
# DATABASE_URL to SQLite), which is what CI's lint job has.
django_settings_module = "law_ai.settings.test"

[[tool.mypy.overrides]]
# `celery` and `lxml` publish no py.typed marker and no first-party stubs.
module = ["neo4j.*", "crewai.*", "langgraph.*", "eyecite.*", "spacy.*", "pypdf.*", "drf_pydantic.*", "channels.*", "channels_redis.*", "daphne.*", "environ.*", "celery.*", "lxml.*", "jose.*", "passlib.*", "ocrmd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "law_ai.settings.test"
addopts = "-ra -q --strict-markers --cov=law_ai --cov-report=term-missing:skip-covered --cov-fail-under=75"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast unit tests",
    "integration: tests that hit real DBs or APIs (require docker)",
    "legalbench: tests using LegalBench benchmark",
    "slow: tests that take >5s",
    "network: live upstream fetch (nightly only; needs LIVE_NETWORK=1)",
    "nlp: loads the real spaCy pipeline shipped in the backend image",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["law_ai"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]