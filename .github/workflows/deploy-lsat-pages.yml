# Deploy the static LSAT practice site (Next.js static export) to GitHub Pages.
#
# Source: lsat-static/ — a Next.js app built with `output: 'export'`. The LSAT
# bank is imported at build time from lsat-static/content.json (the
# HITL-approved artifact refreshed by `make lsat-export`, drift-gated by
# tests/test_lsat_site.py), so the published site is fully serverless.
#
# One-time repo setup: Settings → Pages → Source: "GitHub Actions".

name: deploy-lsat-pages

on:
  push:
    branches: [main]
    paths:
      - "lsat-static/**"
      # Redeploy when the LSAT source bank changes (belt-and-braces: a bank
      # merge should refresh content.json via `make lsat-export` and land here).
      - "backend/law_ai/lsat/services/data/**"
      - ".github/workflows/deploy-lsat-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a production deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lsat-static
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lsat-static/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # GitHub project Pages serve under /<repo>/ — set the base path so
          # _next assets resolve. (next.config.mjs also defaults to /law-ai.)
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Sanity-check the export
        run: |
          test -f out/index.html
          test -s content.json
          # actions/deploy-pages does not run Jekyll, but keep _next safe anyway.
          touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: lsat-static/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
