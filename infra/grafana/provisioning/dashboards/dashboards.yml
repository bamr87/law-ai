# Dashboard provider (BL-20260502-03): everything in /var/lib/grafana/dashboards
# is loaded at boot and kept in sync from disk, so the dashboard is code.
apiVersion: 1

providers:
  - name: law-ai
    orgId: 1
    folder: Law AI
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
