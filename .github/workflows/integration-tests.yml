name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/integration-tests.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/integration-tests.yml'
      - 'docker-compose.yml'

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Docker-backed Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev,test]"

      - name: Start Docker services
        run: docker compose up -d neo4j postgres redis --wait

      - name: Run integration tests
        working-directory: backend
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: lawgraph-dev
          DATABASE_URL: postgresql://lawgraph:lawgraph-dev@localhost:5432/lawgraph
        run: pytest -m integration -v --tb=short

      - name: Teardown Docker services
        if: always()
        run: docker compose down -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/.pytest_cache/
          retention-days: 7
