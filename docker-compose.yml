services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Root .env (see .env.example) is layered under the explicit environment
    # block: `environment` wins over `env_file`, so the dev-stack wiring below
    # stays canonical while operator secrets (AGENT_API_KEY, COURTLISTENER_*,
    # AUTONOMY_*) actually reach the container instead of being silently
    # ignored. `required: false` keeps a fresh clone bootable without a .env.
    env_file:
      - path: ./.env
        required: false
    environment:
      - DATABASE_URL=postgresql://law_ai:law_ai-dev@postgres:5432/law_ai
      # Spec 035: the LangGraph checkpointer reads POSTGRES_URL (not
      # DATABASE_URL); without this override the host-oriented .env value
      # (localhost) leaks in and checkpoint setup silently degrades.
      - POSTGRES_URL=postgresql+asyncpg://law_ai:law_ai-dev@postgres:5432/law_ai
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=law_ai-dev
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_UI_URL=http://localhost:6006
      - PHOENIX_PROJECT_NAME=law_ai
      - LANGGRAPH_CHECKPOINTER=postgres
      # Autonomy loop (spec 018) — default off; set AUTONOMY_ENABLED=True in .env to activate.
      - AUTONOMY_ENABLED=${AUTONOMY_ENABLED:-False}
      - AUTONOMY_ALLOWED_SOURCES=${AUTONOMY_ALLOWED_SOURCES:-}
      # Inside the container, /app == ./backend on host, so var/autonomy is correct.
      - AUTONOMY_DIGEST_DIR=${AUTONOMY_DIGEST_DIR:-var/autonomy}
      - AUTONOMY_MAX_INGEST_PER_CYCLE=${AUTONOMY_MAX_INGEST_PER_CYCLE:-25}
      # Repo root for BACKLOG.md + specs/ (mounted at /repo below).
      - REPO_ROOT=/repo
    depends_on:
      # Healthcheck-gated: migrate/ensure_checkpointer race cold DBs otherwise.
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      # started (not healthy): Ollama pulls models in the background and the
      # API degrades gracefully without it — don't block the whole stack.
      ollama:
        condition: service_started
      phoenix:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./:/repo
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py ensure_checkpointer && daphne -b 0.0.0.0 -p 8000 law_ai.asgi:application"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      # collectstatic + migrate + checkpointer bootstrap runs before daphne.
      start_period: 90s
    restart: on-failure:2

  worker:
    # Spec 011 FR-11: Celery worker for ingestion quarantine + audit fallback.
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: false
    environment:
      - DATABASE_URL=postgresql://law_ai:law_ai-dev@postgres:5432/law_ai
      # Spec 035: the LangGraph checkpointer reads POSTGRES_URL (not
      # DATABASE_URL); without this override the host-oriented .env value
      # (localhost) leaks in and checkpoint setup silently degrades.
      - POSTGRES_URL=postgresql+asyncpg://law_ai:law_ai-dev@postgres:5432/law_ai
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=law_ai-dev
      # Beat-scheduled autonomy cycles (test synthesis, LSAT authoring) call
      # Ollama from THIS container — without this it defaults to localhost.
      - OLLAMA_BASE_URL=http://ollama:11434
      - DJANGO_SETTINGS_MODULE=law_ai.settings.dev
      # Autonomy loop (spec 018) — default off; set AUTONOMY_ENABLED=True in .env to activate.
      - AUTONOMY_ENABLED=${AUTONOMY_ENABLED:-False}
      - AUTONOMY_ALLOWED_SOURCES=${AUTONOMY_ALLOWED_SOURCES:-}
      # Inside the container, /app == ./backend on host, so var/autonomy is correct.
      - AUTONOMY_DIGEST_DIR=${AUTONOMY_DIGEST_DIR:-var/autonomy}
      - AUTONOMY_MAX_INGEST_PER_CYCLE=${AUTONOMY_MAX_INGEST_PER_CYCLE:-25}
      # Repo root for BACKLOG.md + specs/ (mounted at /repo below).
      - REPO_ROOT=/repo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./:/repo
    # --beat embeds the beat scheduler so crontab entries fire in local dev.
    # In production, run a dedicated beat container instead.
    command: celery -A law_ai worker --beat -l info -Q autonomy,celery
    healthcheck:
      # Celery workers have no HTTP port — use inspect ping instead.
      test: [ "CMD-SHELL", "celery -A law_ai inspect ping --destination celery@$$HOSTNAME || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: on-failure:2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      # started, not healthy: Next dev doesn't need the API to boot, and
      # blocking the UI on backend migrations makes the dev loop miserable.
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    healthcheck:
      # node:alpine ships busybox wget; Next dev serves / once compiled.
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: law_ai
      POSTGRES_PASSWORD: law_ai-dev
      POSTGRES_DB: law_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U law_ai" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/law_ai-dev
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      # Bounded memory so Neo4j + Ollama can coexist on the 32 GB laptops
      # the constitution targets (defaults grow with host RAM otherwise).
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 4g

  ollama:
    # Pinned (was :latest): reproducible dev + eval runs. Bump deliberately —
    # a silent Ollama upgrade can shift LegalBench numbers under you.
    image: ollama/ollama:0.12.6
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
      - ./backend/scripts/ollama-bootstrap.sh:/scripts/ollama-bootstrap.sh:ro
      - ./backend/scripts/ollama-healthcheck.sh:/scripts/ollama-healthcheck.sh:ro
    environment:
      # Unload idle models so 7B + 8B don't sit resident together on
      # 32 GB Apple Silicon laptops.
      - OLLAMA_KEEP_ALIVE=5m
      # Single source of truth for the model set: the bootstrap script reads
      # this, and `make local-ai-pull` reads it back out of the container so
      # the list cannot drift between the two (BL-20260810-12).
      - OLLAMA_BOOTSTRAP_MODELS=${OLLAMA_BOOTSTRAP_MODELS:-mistral:7b-instruct-q4_K_M llama3.1:8b-instruct-q4_K_M nomic-embed-text}
    # Spec 010 FR-7: idempotent bootstrap pulls the default model set in
    # the background; the smallest model gates readiness so the rest of
    # the stack starts quickly.
    entrypoint: [ "/bin/sh" ]
    command: [ "/scripts/ollama-bootstrap.sh" ]
    healthcheck:
      # Gate on the GATE MODEL being present, not merely on the server
      # answering (BL-20260810-12). A model-less-but-listening Ollama used
      # to pass this check, so `up --wait` could hand a green stack to the
      # nightly eval and every item would fail against a missing model.
      test: [ "CMD-SHELL", "/scripts/ollama-healthcheck.sh" ]
      interval: 15s
      timeout: 10s
      retries: 20
      # Generous: the gate model is a ~4 GB pull on a cold volume.
      start_period: 600s
    restart: unless-stopped
    mem_limit: 12g

  phoenix:
    # Spec 010 FR-6: self-hosted Arize Phoenix as the OTEL collector + UI.
    # Pinned (was :latest) for reproducible traces UI + OTLP behavior.
    image: arizephoenix/phoenix:12.9.0
    ports:
      - "6006:6006" # UI + OTLP/HTTP
      - "4317:4317" # OTLP/gRPC (unused today, exposed for future)
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix:/data
    healthcheck:
      # Distroless image: NO /bin/sh, so CMD-SHELL can never run — exec-form
      # with the bare python binary (present at /usr/bin/python) is required.
      # An uncaught urlopen exception is a nonzero exit, so no `|| exit 1`.
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006', timeout=3)" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
  ollama:
  phoenix:
