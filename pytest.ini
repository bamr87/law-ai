[pytest]
# Repo-wide test entry point.
#
# This config drives the top-level `tests/` suite, which acts as a single
# orchestrator over the whole monorepo: structure checks, spec/backlog
# linters, docs presence, config sanity, and (opt-in) backend/frontend
# subprocess suites.
#
# The backend has its own pytest config at backend/pyproject.toml; this
# root config intentionally does NOT discover backend/ or frontend/ tests
# directly so we avoid double-collection and conflicting coverage rules.
minversion = 8.0
testpaths = tests
addopts = -ra --strict-markers --tb=short
norecursedirs = backend frontend node_modules .venv .next htmlcov coverage .git specs/_template
markers =
    smoke: fast checks that should always pass (structure, configs, docs)
    specs: the fleet's spec/backlog gates (resolved by tools/fleet-kit.sh) run as tests
    backend: invokes the backend pytest suite as a subprocess (slow)
    frontend: invokes the frontend vitest suite as a subprocess (slow, needs node_modules)
    slow: any test expected to take >5s
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
