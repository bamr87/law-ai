name: "Factory: Issue Concierge"
on:
  issues:
    types:
      - opened
concurrency:
  group: factory--issue-concierge-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.ISSUE_CONCIERGE_ENABLED }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |-
          if [ "$ENABLED" = "true" ] && { [ -n "$OAUTH" ] || [ -n "$KEY" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate closed — set the 'ISSUE_CONCIERGE_ENABLED' variable to true and provision Claude auth to arm this line."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
  line:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' && github.event.sender.type != 'Bot' }}
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: ⚙ agent.claude (a)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: |-
            REPO: ${{ github.repository }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}

            Read and follow the operating instructions in .factory/prompts/issue-concierge.md.

            OBLIGATIONS (complete every item, nothing else):
            1. [sink.label lb] Apply the appropriate labels to issue #${{ github.event.issue.number }} using `gh issue edit --add-label`. Prefer existing labels (`gh label list`).
            2. [sink.comment cm] Post exactly one comment on issue #${{ github.event.issue.number }} that posts ONE short triage comment (kind/severity guess + where it lands in BACKLOG.md); never posts a second comment on the same issue.
          claude_args: |-
            --model claude-sonnet-5-5
            --max-turns 10
            --allowedTools "Bash(gh issue view:*),Bash(gh search issues:*),Read,Glob,Grep,Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"
