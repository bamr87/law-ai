name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas the diff touches so the expensive backend/frontend
  # jobs (service containers, full npm ci) skip on docs/config-only changes.
  # spec-gate and repo-structural still run on every push/PR.
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  spec-gate:
    name: Spec Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # backlog_lint.py compares against HEAD~1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate specs
        run: python scripts/spec_validator.py
      - name: Validate BACKLOG.md
        run: python scripts/backlog_lint.py

  repo-structural:
    name: Repo Structural Tests (docs / specs / configs)
    # The root tests/ smoke+specs tier validates docs, specs, backlog, configs,
    # and repo structure. It is dependency-light by design (tests/conftest.py):
    # no Docker, Neo4j, or node_modules — just pytest. The heavier backend/
    # frontend subprocess suites are excluded via markers.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: spec-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Run root structural suite (smoke + specs)
        run: pytest tests/ -m "not backend and not frontend" -q

  clean-install-smoke:
    name: Clean-Install Import Smoke
    # Catches undeclared dependencies (PR #1, finding #1: lxml was a transitive
    # of beautifulsoup4 locally but not declared in pyproject.toml). Installs
    # the base package only — no [dev], no cache — and import-checks every
    # top-level Django app + each ingestion service entry point.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [spec-gate, changes]
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Intentionally no cache: pip — we want a representative cold install.
      - name: Install package only (no extras)
        run: pip install -e .
      - name: Import-check public modules
        env:
          DJANGO_SETTINGS_MODULE: law_ai.settings.test
          DATABASE_URL: sqlite:///./_smoke.sqlite3
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          AGENT_API_KEY: smoke
        run: |
          python - <<'PY'
          import importlib, django
          django.setup()  # required for Django ORM models
          modules = [
              # Pure Pydantic / utility modules — no Django
              "law_ai.core.schemas",
              "law_ai.core.schemas.legal_documents",
              "law_ai.core.schemas.statute_extraction",
              "law_ai.core.neo4j.statute_queries",
              "law_ai.ingestionapp.quarantine_kinds",
              # Ingestion services — these are the modules that broke in PR #1
              # because of an undeclared lxml dependency.
              "law_ai.ingestionapp.services.scout",
              "law_ai.ingestionapp.services.statute_scout",
              "law_ai.ingestionapp.services.colorado_statutes",
              "law_ai.ingestionapp.services.courtlistener",
              # Django-dependent surfaces
              "law_ai.ingestionapp.models",
              "law_ai.ingestionapp.tasks",
              "law_ai.audit.models",
              "law_ai.asgi",  # boots the whole ASGI app + URLConf
          ]
          failed = []
          for m in modules:
              try:
                  importlib.import_module(m)
              except Exception as exc:  # noqa: BLE001
                  failed.append(f"{m}: {type(exc).__name__}: {exc}")
          if failed:
              print("CLEAN-INSTALL IMPORT FAILURES:")
              for line in failed:
                  print(f"  - {line}")
              raise SystemExit(1)
          print(f"OK: imported {len(modules)} modules from a clean install")
          PY

  backend-lint:
    name: Backend Lint + Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [spec-gate, changes]
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy law_ai --strict
        continue-on-error: true # tighten once strict-clean

  backend-test:
    name: Backend Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [spec-gate, changes]
    if: needs.changes.outputs.backend == 'true'
    services:
      neo4j:
        image: neo4j:5-community
        ports: ["7687:7687"]
        env:
          NEO4J_AUTH: neo4j/testpassword
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run pytest with coverage
        # Integration tests require Docker fixtures that aren't available here;
        # they run in the dedicated 'Docker-backed Integration Tests' workflow.
        run: pytest -q -m "not integration" --cov=law_ai --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [spec-gate, changes]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run

  legalbench:
    name: LegalBench Regression (changed reasoning only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-test
    if: contains(github.event.pull_request.labels.*.name, 'reasoning-change')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,legalbench]"
      - name: Run LegalBench subset
        run: python -m app.eval.legalbench --subset core_reasoning,precedent_retrieval
