# Provisioned datasource (BL-20260502-03). Grafana reads this at boot, so the
# stack comes up with the datasource already wired — no click-through setup.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
