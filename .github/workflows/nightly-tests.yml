name: Nightly Tests & Autonomy

# Runs weekly on Monday at 06:00 UTC.  Also triggerable manually with an
# optional `dry_run` flag that skips the expensive Docker steps (coverage,
# LegalBench, the live-model slice) while still validating spec/backlog gates
# and opening the PR.
#
# NOTE: cadence was reduced from daily to weekly after 37/37 scheduled runs
# failed on hosted-runner disk exhaustion (0 MB free during `docker compose
# up` after building both app images). Restore daily cadence only after a
# sustained green streak.

on:
  # Schedule paused (Actions waste reduction, Oct 14): Actions jobs in this private repo are refused
  # by the billing block ("recent account payments have failed or your spending limit needs to be
  # increased"), bamr87/bamr87#268, so every scheduled run failed without running.
  # To restore once billing is fixed: uncomment the schedule block below (workflow_dispatch still works).
  # schedule:
  #   - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Skip expensive steps (coverage, LegalBench, the live-model slice).
          Spec/backlog gates + PR plumbing still run so you can test the workflow.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # BL-20260503-14: the stale-backlog triage step opens/labels an issue.
  issues: write

jobs:
  nightly:
    name: Nightly Tests & Autonomy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------
      # Reclaim hosted-runner disk space BEFORE building. Every scheduled
      # run of this workflow died with "Free space left: 0 MB" during
      # `docker compose up` (see run 28644585073, 2026-07-03): the backend
      # image (chromadb/spacy/onnxruntime/crewai/langgraph) is multi-GB and
      # the standard ubuntu-latest runner only has ~14 GB free. Removing
      # the preinstalled Android SDK, .NET, GHC, and CodeQL toolcaches
      # reclaims ~25-30 GB.
      # ------------------------------------------------------------------
      - name: Free disk space on hosted runner
        if: ${{ !inputs.dry_run }}
        run: |
          echo "Disk before cleanup:" && df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          echo "Disk after cleanup:" && df -h /

      # ------------------------------------------------------------------
      # Build images once — reused by all make targets below.
      # ------------------------------------------------------------------
      - name: Build Docker images
        if: ${{ !inputs.dry_run }}
        run: docker compose build backend frontend

      # Drop the intermediate build cache once images exist — the layer
      # cache is not reused within this run and costs several GB.
      - name: Reclaim Docker build cache
        if: ${{ !inputs.dry_run }}
        run: |
          docker builder prune -f
          df -h /

      # ------------------------------------------------------------------
      # Infra services — needed by test-legalbench + autonomy-run.
      # ------------------------------------------------------------------
      - name: Start infrastructure services
        if: ${{ !inputs.dry_run }}
        run: docker compose up -d neo4j postgres redis ollama phoenix --wait

      # ------------------------------------------------------------------
      # Pull the LegalBench gate model (BL-20260511-26). Starting the Ollama
      # container is not enough: its model store is an empty named volume on
      # a fresh runner, so `make test-legalbench-gate` exits 2 ("could not
      # run — model not pulled") rather than producing a score. This is the
      # step whose absence meant the scored eval had never actually run in
      # CI.
      #
      # Only the gate model, deliberately: `make local-ai-pull` walks
      # OLLAMA_BOOTSTRAP_MODELS (~10 GB across three models) and the extra
      # two are not used by the eval. mistral:7b-instruct-q4_K_M is ~4.4 GB,
      # which the disk-cleanup step above leaves ample room for.
      # ------------------------------------------------------------------
      - name: Pull the LegalBench gate model
        if: ${{ !inputs.dry_run }}
        env:
          GATE_MODEL: mistral:7b-instruct-q4_K_M
        run: |
          docker compose exec -T ollama ollama pull "$GATE_MODEL"
          docker compose exec -T ollama ollama list
          df -h /

      # ------------------------------------------------------------------
      # Pulled is not serving (bamr87/bamr87#253). `ollama list` succeeded on
      # every one of the 38 red nightlies; what it cannot tell you is whether
      # the model answers a real generation on this CPU-only runner before the
      # backend's per-attempt deadline (OLLAMA_REQUEST_TIMEOUT_S, 120s). Ask
      # for one, and fail here in ~2 minutes with a legible reason instead of
      # inside the LegalBench gate or a degraded autonomy cycle much later.
      # ------------------------------------------------------------------
      - name: Probe that the gate model serves
        if: ${{ !inputs.dry_run }}
        run: >-
          python3 scripts/ollama_serving_probe.py
          --url "http://127.0.0.1:${LAW_AI_OLLAMA_PORT:-11434}"
          --model mistral:7b-instruct-q4_K_M
          --deadline 120 --tokens 32

      # ------------------------------------------------------------------
      # Coverage — emits backend/coverage.xml via bind mount (./backend:/app).
      # evolve_audit.py reads coverage.xml to detect shortfalls.
      # ------------------------------------------------------------------
      - name: Run test coverage
        if: ${{ !inputs.dry_run }}
        run: make test-coverage

      # ------------------------------------------------------------------
      # LegalBench dataset cache (BL-20260811-09). The task items are never
      # vendored — the decision is "CI downloads at a pinned revision" — so
      # the gate below would score synthetic stubs without this step. The
      # cache key carries the revisions pinned in law_ai/eval/fetch.py, so a
      # revision bump invalidates it instead of re-benchmarking stale data.
      # ------------------------------------------------------------------
      - name: Resolve LegalBench dataset revision
        if: ${{ !inputs.dry_run }}
        id: legalbench-revision
        run: |
          echo "key=$(sha256sum backend/law_ai/eval/fetch.py backend/var/legalbench/manifest.json | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Restore cached LegalBench dataset
        if: ${{ !inputs.dry_run }}
        id: legalbench-cache
        uses: actions/cache@v4
        with:
          path: backend/var/legalbench/*/items.jsonl
          key: legalbench-items-${{ steps.legalbench-revision.outputs.key }}

      - name: Fetch LegalBench dataset (pinned revision, licence-checked)
        if: ${{ !inputs.dry_run && steps.legalbench-cache.outputs.cache-hit != 'true' }}
        run: make legalbench-cache

      # ------------------------------------------------------------------
      # LegalBench regression eval.
      # ------------------------------------------------------------------
      # Gating form (spec 031): exit 1 on a >1 pp drop vs baseline.json,
      # exit 2 when the eval could not run at all (Ollama down / model not
      # pulled) — previously an unreachable model scored every item wrong
      # and reported a cheerful accuracy of 0.0.
      - name: Run LegalBench eval (regression gate)
        if: ${{ !inputs.dry_run }}
        run: make test-legalbench-gate

      - name: Upload LegalBench reports + score history
        if: ${{ !inputs.dry_run && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: legalbench-${{ github.run_id }}
          path: |
            backend/var/legalbench/*.json
            backend/var/legalbench/history.jsonl
          retention-days: 90

      # BL-20260811-12: the score history was only ever a downloadable
      # artifact, which is where reviewers do not look. Render the last runs
      # into the run summary page instead. Stdlib python3 on the runner —
      # no container, and never fails the job.
      - name: Summarise LegalBench score history
        if: ${{ !inputs.dry_run && always() }}
        continue-on-error: true
        run: python3 scripts/legalbench_summary.py >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Are the benchmark pins still current? (BL-20260906-30)
      #
      # `law_ai/eval/fetch.py` pins the dataset and prompt revisions by hand,
      # which is right — a benchmark that moves under the harness makes the
      # 1 pp regression policy meaningless. But nothing watched the pins, so
      # the benchmark would age by neglect instead of by decision. Drift is
      # reported, never failed: bumping a revision is a deliberate act with a
      # re-cache and a re-baseline attached (docs/legalbench.md).
      #
      # Runs in `dry_run` too: it is stdlib plus two HTTP GETs, with no
      # Docker and no model behind it.
      # ------------------------------------------------------------------
      - name: Check the pinned LegalBench revisions against upstream
        if: ${{ always() }}
        continue-on-error: true
        run: |
          {
            echo "## LegalBench revision pins"
            echo '```'
            python3 scripts/check_legalbench_revisions.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Browser end-to-end (spec 051 / BL-20260811-16). The full suite is
      # nightly, not per-PR: a full-stack boot plus a browser image is minutes,
      # and the cheap half of the boundary (the API contract gate) already runs
      # in `make test`. The a11y spec is the exception — ci.yml's `a11y` job
      # runs it on every PR touching frontend/ (BL-20260831-09).
      # `backend-e2e` is pinned to an unreachable Ollama, so no model is
      # called and nothing is billed. See docs/e2e-testing.md.
      # ------------------------------------------------------------------
      - name: Run browser end-to-end suite
        if: ${{ !inputs.dry_run }}
        run: make test-e2e

      # BL-20260430-11: the auth spec's whole point is that the stack runs
      # BOTH ways, and its gated half is `test.skip`ped whenever
      # E2E_AGENT_API_KEY is empty — which the bare run above always leaves it.
      # So a second, targeted leg re-boots the sidecar WITH a key and runs only
      # api-auth.spec.ts. The key is a throwaway for this run: it gates the
      # e2e sidecar and nothing else, so it is generated here rather than
      # stored as a secret. Without this step nothing in CI would notice the
      # backend gate or the proxy's server-side key injection regressing.
      - name: Run browser end-to-end suite (API key gated)
        if: ${{ !inputs.dry_run }}
        run: |
          make test-e2e \
            E2E_AGENT_API_KEY="nightly-gate-${GITHUB_RUN_ID}" \
            E2E_ARGS='e2e/api-auth.spec.ts'

      # ------------------------------------------------------------------
      # Viewport measurements for the static LSAT site (BL-20260901-03). The
      # header heights, 44px targets, nav strip and sticky passage column are
      # layout facts; the jsdom suite in ci.yml has no layout engine, so this
      # builds `out/` and measures it in the pinned browser image. Nightly for
      # the same reason as the suite above: it is a build plus a browser.
      # ------------------------------------------------------------------
      - name: Run LSAT static-site viewport suite
        if: ${{ !inputs.dry_run }}
        run: make lsat-static-e2e

      # ------------------------------------------------------------------
      # Live-network drift smoke (BL-20260511-07). One real Justia fetch per
      # run, re-parsed, so upstream HTML drift surfaces here instead of as a
      # silently empty corpus. NOT continue-on-error: the test itself now
      # separates the two outcomes — a blocked or unreachable upstream (today's
      # normal: law.justia.com answers every plain client with a Cloudflare
      # 403) *skips*, while a fetch that succeeds and then parses to zero or
      # malformed sections fails. Only the second reddens the nightly, which is
      # the whole point of the step. Never add this to ci.yml.
      # ------------------------------------------------------------------
      - name: Run live-network drift smoke (Justia CRS)
        if: ${{ !inputs.dry_run }}
        run: make test-live-network

      - name: Upload Playwright report
        if: ${{ !inputs.dry_run && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            lsat-static/test-results/
          retention-days: 14

      # ------------------------------------------------------------------
      # Spec / BACKLOG validators — the hub's spec-driven kit, resolved by
      # tools/fleet-kit.sh (a cached sparse clone of bamr87/bamr87 on the
      # runner; a parent hub checkout on a laptop). Host stdlib only, no
      # container. CI's PR-time gate is the same kit through the reusable
      # spec-gate.yml; the `backlog-triage` job below is its stale report.
      # ------------------------------------------------------------------
      - name: Resolve the fleet's spec-driven kit
        id: kit
        run: echo "dir=$(tools/fleet-kit.sh)" >> "$GITHUB_OUTPUT"

      - name: Validate spec & backlog gates
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: |
          python3 "$KIT/tools/spec_validator.py" --root . --strict
          python3 "$KIT/tools/backlog_lint.py" --root .

      # The weekly stale-backlog triage issue (BL-20260503-14) is the
      # `backlog-triage` job at the bottom of this workflow: the hub's reusable
      # spec gate with `stale-report` + `file-issue`, replacing both the
      # hand-rolled step that lived here and the `governance-triage` Celery
      # beat job the backend used to run over a bind-mounted repo.

      # ------------------------------------------------------------------
      # Discovery audit — the kit's evolve_audit.py (TODO/FIXME scan, docs
      # AGENTS.md names that are missing, a coverage shortfall read from
      # backend/coverage.xml). Appends new BL-* entries to BACKLOG.md; the
      # draft PR below carries them. A LegalBench regression no longer
      # routes through here: `make test-legalbench-gate` above already fails
      # the run on a >1 pp drop (spec 031).
      # ------------------------------------------------------------------
      - name: Run discovery audit
        id: audit
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: |
          python3 "$KIT/tools/evolve_audit.py" --root . --coverage-xml backend/coverage.xml | tee audit.out
          # Track whether BACKLOG.md was modified so we can include it in the PR.
          if git diff --quiet BACKLOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------------
      # Compose the autonomy digest for THIS run (BL-20260511-19).
      #
      # `--window-to-now` matters: the default window is
      # [yesterday 00:00, today 00:00) UTC, so a digest composed inside a
      # 06:00 UTC run would contain none of the events the same run just
      # produced. Infra is still up here and AUTONOMY_ENABLED must be set
      # explicitly (compose defaults it to False per constitution §12 I3).
      # ------------------------------------------------------------------
      - name: Compose autonomy digest
        id: digest
        if: ${{ !inputs.dry_run && always() }}
        continue-on-error: true
        env:
          AUTONOMY_ENABLED: "True"
        run: |
          make autonomy-run KIND=digest ARGS=--window-to-now
          echo "path=backend/var/autonomy/digest-$(date -u +%F).md" >> "$GITHUB_OUTPUT"

      # The digest was only ever a file inside a container (and, at best, a
      # downloadable artifact) — which is where nobody looks. Render it into
      # the Actions run summary. `|| true` throughout: a missing digest must
      # never redden the nightly.
      - name: Post the autonomy digest to the run summary
        if: ${{ !inputs.dry_run && always() }}
        continue-on-error: true
        run: |
          {
            echo "## Autonomy digest"
            digest="${{ steps.digest.outputs.path }}"
            if [ -n "$digest" ] && [ -f "$digest" ]; then
              # Demote the digest's own H1 so it nests under the heading above.
              sed 's/^# /### /' "$digest" || true
            else
              echo "_No digest was composed for this run._"
            fi
            echo ""
            echo "## Discovery audit"
            echo '```'
            cat audit.out 2>/dev/null || echo "(no audit output)"
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY" || true

      # ------------------------------------------------------------------
      # Live-model integration slice (BL-20260906-81, BL-20260906-94). The
      # factory's Ollama executor and the autonomy → HITL path both pass for
      # real, but `make test-integration-ollama` ran only when someone typed
      # it, so a regression in executor → intake → proposals reached main
      # unnoticed. A 3B q4 is ~2 GB on disk and holds in the runner's memory;
      # the target pulls it if the volume lacks it.
      #
      # LAST before teardown on purpose: the target's own trap stops ollama,
      # postgres and redis when it finishes, which would pull the floor out
      # from under any step that ran after it.
      #
      # continue-on-error while the step earns its keep: the slice has never
      # run on a hosted runner, and a first red from an unproven step would
      # only teach people to ignore the nightly. Promote it to a hard failure
      # once it has a green streak.
      # ------------------------------------------------------------------
      - name: Run the live-model integration slice (Ollama)
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: make test-integration-ollama

      # ------------------------------------------------------------------
      # Tear down services.
      # ------------------------------------------------------------------
      - name: Teardown Docker services
        if: ${{ always() && !inputs.dry_run }}
        run: docker compose down

      # ------------------------------------------------------------------
      # Artifacts.
      # ------------------------------------------------------------------
      - name: Upload coverage report
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_id }}
          path: |
            backend/htmlcov/
            backend/coverage.xml
          retention-days: 14

      - name: Upload evolve audit output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-${{ github.run_id }}
          path: audit.out
          retention-days: 14

      # The summary is ephemeral once the run ages out; keep the digest file
      # too so a later investigation still has it (BL-20260511-19).
      - name: Upload autonomy digest
        if: ${{ !inputs.dry_run && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: autonomy-digest-${{ github.run_id }}
          path: backend/var/autonomy/digest-*.md
          retention-days: 30
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # Open a draft PR when the discovery audit appended BACKLOG entries.
      # (Proposed test files rode this PR until the test pillar was retired
      # on 2026-10-26, ADR 0008.)
      #
      # `!env.ACT` keeps `make nightly-dry-run` (nektos/act, which sets
      # ACT=true) from pushing a branch to the real repo while an engineer is
      # smoke-testing the workflow locally — BL-20260511-18.
      # ------------------------------------------------------------------
      - name: Open draft PR
        if: ${{ !env.ACT && steps.audit.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: nightly/auto-${{ github.run_id }}
          title: "chore(nightly): BACKLOG audit"
          draft: true
          commit-message: "chore(nightly): BACKLOG updates from nightly run"
          body: |
            Automated nightly run from `.github/workflows/nightly-tests.yml`.

            | Signal | Value |
            |---|---|
            | BACKLOG updated | ${{ steps.audit.outputs.changed }} |

            **BACKLOG entries** are appended under `## Open` in `BACKLOG.md` by the
            discovery audit (the fleet kit's `evolve_audit.py`).

            See the `audit-${{ github.run_id }}` artifact for the full discovery
            audit output.
          labels: |
            autonomy
            nightly

  # ------------------------------------------------------------------
  # Weekly backlog triage (BL-20260503-14), by reference: the hub's reusable
  # spec gate with the stale report on, filing or updating ONE idempotent
  # `backlog-triage` issue when an `## Open` item is older than 60 days or a
  # spec is inconsistent. Schedule only — a dispatch (and `make
  # nightly-dry-run` under act) never files an issue. The caller declares
  # the write permission; the reusable workflow inherits and cannot widen it.
  # ------------------------------------------------------------------
  backlog-triage:
    name: Backlog triage
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
    uses: bamr87/bamr87/.github/workflows/spec-gate.yml@v2
    with:
      strict: false
      stale-report: true
      stale-days: 60
      file-issue: true
