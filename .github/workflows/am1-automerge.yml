name: AM-1 auto-merge

# Auto-merges ONLY the narrow AM-1 class (constitution §12 I1 as amended by
# ADR 0004 §2): a PR whose entire diff removes `@pytest.mark.skip(
# "autonomy-proposed")` decorators from `*.proposed.py` files (test-only,
# removal-only), when all gates are green.
#
# This is the SOLE workflow granted merge permission. It fails closed: any
# guard that does not pass → no merge. Layers of defence:
#   1. vars.AM1_AUTOMERGE_ENABLED == 'true'  (kill-switch, default OFF)
#   2. PR carries the `auto-merge:AM-1` label
#   3. PR head is in THIS repo (never a fork — no untrusted code with our token)
#   4. scripts/check_am1_eligible.py confirms the diff is a pure un-skip
#   5. all PR checks are green (gh pr checks)
# Only then: squash-merge. Revert is a single commit; the label makes every
# such merge auditable.

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: am1-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  am1:
    if: >-
      vars.AM1_AUTOMERGE_ENABLED == 'true' &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge:AM-1') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check AM-1 eligibility (test-only un-skip)
        run: |
          base="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --depth=200 origin "${{ github.event.pull_request.base.ref }}"
          echo "Diffing ${base}...HEAD"
          git diff "${base}...HEAD" | python3 scripts/check_am1_eligible.py | tee verdict.json
          python3 -c "import json,sys; sys.exit(0 if json.load(open('verdict.json'))['eligible'] else 1)"

      - name: Require all PR checks green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails (non-zero) if any check is failing or still pending — fail closed.
          gh pr checks "${{ github.event.pull_request.number }}" --required || \
          gh pr checks "${{ github.event.pull_request.number }}"

      - name: Squash-merge (AM-1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --squash --delete-branch \
            --subject "test(autonomy): AM-1 un-skip proposed tests (#${{ github.event.pull_request.number }})"
